<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>КОНВЕЙЕР — Бюро Незавершённых Вещей</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#16224a,#070a14 60%);
    color:#e8eeff;display:flex;justify-content:center;align-items:center;padding:10px;
    overflow:hidden;touch-action:manipulation;user-select:none}
  body.shake #app{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #app{width:min(580px,100%);display:flex;flex-direction:column;gap:8px}

  #hud{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px}
  .chip{background:rgba(255,255,255,.06);border:1px solid rgba(120,150,255,.2);
    padding:4px 9px;border-radius:10px;white-space:nowrap}
  .chip.gold{border-color:rgba(255,201,77,.4);color:#ffd166}
  .chip.progress{border-color:rgba(61,220,151,.4);color:#3ddc97}
  .spacer{flex:1}

  #beltArea{position:relative;height:190px;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#131a2e,#0b1020);
    border:1px solid rgba(120,150,255,.18);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);transition:box-shadow .3s}
  #beltArea.hot{box-shadow:inset 0 0 80px rgba(255,93,115,.3),0 0 20px rgba(255,93,115,.3)}
  #belt{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px);
    animation:beltMove 1.1s linear infinite}
  @keyframes beltMove{to{background-position:-52px 0}}

  #timerBar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.4);z-index:10}
  #timerFill{height:100%;background:linear-gradient(90deg,#3ddc97,#6c8cff);transition:width .1s linear;width:100%}
  #timerFill.low{background:linear-gradient(90deg,#ff5d73,#ffc94d);animation:timerPulse .6s infinite}
  @keyframes timerPulse{50%{opacity:.6}}

  #heatBar{position:absolute;top:4px;left:0;right:0;height:4px;background:rgba(0,0,0,.4);z-index:10}
  #heatFill{height:100%;width:0%;background:linear-gradient(90deg,#ffc94d,#ff5d73);transition:width .15s}
  #heatFill.warn{animation:heatWarn .5s infinite}
  @keyframes heatWarn{50%{opacity:.55}}

  #comboBadge{position:absolute;top:18px;right:12px;font-size:22px;font-weight:900;
    color:#ffc94d;text-shadow:0 0 15px rgba(255,201,77,.9);
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
  #comboBadge.show{opacity:1}
  #comboBadge.bump{animation:comboBump .3s}
  @keyframes comboBump{50%{transform:scale(1.4)}}

  #tutorialHint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:11.5px;padding:6px 14px;border-radius:10px;
    background:rgba(20,28,48,.85);border:1px solid rgba(108,140,255,.35);
    white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:12}

  .obj{position:absolute;top:50%;left:0;margin-top:-40px;width:76px;height:80px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    cursor:pointer;will-change:transform;touch-action:none;
    transition:background .15s,border-color .15s,box-shadow .15s,opacity .3s,scale .3s}
  .obj .em{font-size:30px;line-height:1;pointer-events:none}
  .obj .nm{font-size:8.5px;opacity:.6;max-width:70px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;pointer-events:none}
  .obj.selected{border-color:#ffc94d;background:rgba(255,201,77,.13);
    box-shadow:0 0 0 2px rgba(255,201,77,.45),0 0 26px rgba(255,201,77,.35);z-index:5}
  .obj.named{border-color:#c86bff;background:rgba(200,107,255,.13);
    box-shadow:0 0 0 2px rgba(200,107,255,.4),0 0 28px rgba(200,107,255,.55);
    animation:namedPulse 1.4s ease-in-out infinite}
  @keyframes namedPulse{50%{box-shadow:0 0 0 4px rgba(200,107,255,.25),0 0 40px rgba(200,107,255,.85)}}
  .obj.sorted{opacity:0;scale:.25;pointer-events:none}
  .obj.wrong{opacity:0;scale:.8;background:rgba(255,93,115,.25);border-color:#ff5d73;pointer-events:none}
  .obj.miss{opacity:0;scale:.6;pointer-events:none}

  #bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bin{position:relative;background:linear-gradient(180deg,#18213d,#101728);
    border:1px solid rgba(120,150,255,.25);border-radius:16px;padding:10px 4px;
    text-align:center;cursor:pointer;transition:transform .1s,border-color .2s,background .2s,opacity .2s}
  .bin:active{transform:scale(.95)}
  .bin .bEm{font-size:23px;line-height:1.1;pointer-events:none}
  .bin .bNm{font-size:10.5px;opacity:.8;margin-top:2px;pointer-events:none}
  .bin.hit{border-color:#3ddc97;background:linear-gradient(180deg,#16352b,#101728)}
  .bin.err{border-color:#ff5d73;background:linear-gradient(180deg,#33161f,#101728)}
  .bin.drop-hover{border-color:#ffc94d;background:linear-gradient(180deg,#3d3216,#101728);
    transform:scale(1.06);box-shadow:0 0 25px rgba(255,201,77,.5)}

  #toolBar{display:flex;gap:8px;justify-content:center;min-height:36px}
  .tool{flex:0 0 auto;min-width:110px;padding:8px 14px;border-radius:12px;
    background:linear-gradient(180deg,#1a2240,#101728);
    border:1px solid rgba(120,150,255,.3);font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;justify-content:center;
    transition:transform .1s,border-color .2s,opacity .2s;position:relative;overflow:hidden}
  .tool:active{transform:scale(.95)}
  .tool.ready{border-color:rgba(61,220,151,.5);box-shadow:0 0 10px rgba(61,220,151,.2)}
  .tool.cooling{opacity:.5;cursor:not-allowed}
  .tool .cd-fill{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:left;transition:transform .1s linear}
  .tool .label{position:relative;z-index:1}

  .pop{position:absolute;font-weight:800;font-size:15px;pointer-events:none;
    animation:popUp .9s ease-out forwards;text-shadow:0 0 12px currentColor;z-index:8}
  .pop.good{color:#3ddc97}
  .pop.bad{color:#ff5d73}
  @keyframes popUp{to{opacity:0;transform:translateY(-55px)}}

  #whisperBtn{position:absolute;top:20px;left:14px;font-size:30px;cursor:pointer;
    z-index:15;opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s;
    filter:drop-shadow(0 0 12px rgba(200,107,255,.9));animation:whisperFloat 2s ease-in-out infinite}
  #whisperBtn.show{opacity:1;transform:scale(1)}
  @keyframes whisperFloat{50%{transform:translateY(-6px) scale(1.05)}}

  .ghost{position:absolute;font-size:24px;pointer-events:none;z-index:12;
    filter:drop-shadow(0 0 10px rgba(200,107,255,.7));transition:opacity .3s}

  #modal{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #modal.hidden{display:none}
  .card{width:min(500px,100%);max-height:92vh;overflow-y:auto;
    background:linear-gradient(180deg,#131c33,#0c1222);
    border:1px solid rgba(120,150,255,.28);border-radius:22px;padding:22px;
    animation:cardIn .3s ease-out}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
  .intro-emoji{font-size:56px;text-align:center;line-height:1;margin-bottom:6px;
    animation:emojiFloat 3s ease-in-out infinite}
  @keyframes emojiFloat{50%{transform:translateY(-6px)}}
  .intro-kicker{font-size:11px;text-align:center;opacity:.5;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:4px}
  .intro-title{font-size:21px;font-weight:900;text-align:center;line-height:1.2;
    background:linear-gradient(90deg,#a86bff,#6c8cff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .intro-body{font-size:14px;line-height:1.65;opacity:.85;margin-top:14px;
    padding:14px;background:rgba(255,255,255,.03);border-radius:12px;
    border-left:3px solid rgba(108,140,255,.5)}
  .intro-body.speaker-boss{border-left-color:rgba(255,201,77,.7);
    background:rgba(255,201,77,.05)}
  .intro-body.speaker-whisper{border-left-color:rgba(200,107,255,.7);
    background:rgba(200,107,255,.05);font-style:italic}
  .speaker-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;
    opacity:.65;margin-bottom:6px;font-weight:700}
  .speaker-boss .speaker-label{color:#ffc94d}
  .speaker-whisper .speaker-label{color:#c86bff}
  .rules-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .rules-list .rule{display:flex;gap:10px;align-items:flex-start;
    background:rgba(255,255,255,.04);padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5}
  .rules-list .rule .icon{font-size:18px;flex-shrink:0}
  .intro-progress{display:flex;gap:5px;justify-content:center;margin-top:18px}
  .intro-progress .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);
    transition:background .2s,width .2s}
  .intro-progress .dot.active{background:#6c8cff;width:18px;border-radius:3px}
  .intro-progress .dot.done{background:rgba(108,140,255,.5)}

  .dEm{font-size:52px;text-align:center;line-height:1}
  .dName{font-size:12px;text-align:center;opacity:.55;margin-top:6px;
    letter-spacing:2px;text-transform:uppercase}
  .dTitle{font-size:19px;font-weight:800;text-align:center;margin-top:2px}
  .dPlea{font-size:14px;opacity:.85;text-align:center;margin-top:12px;line-height:1.6;
    font-style:italic;padding:12px;background:rgba(255,255,255,.04);border-radius:12px;
    border-left:3px solid rgba(200,107,255,.6)}
  .dText{font-size:14px;opacity:.85;margin-top:12px;line-height:1.6}
  .dOpts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .dOpts button{display:flex;flex-direction:column;gap:3px;text-align:left;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    color:#e8eeff;padding:11px 14px;border-radius:14px;font:inherit;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s}
  .dOpts button:hover{background:rgba(108,140,255,.15);border-color:rgba(108,140,255,.5)}
  .dOpts button:active{transform:scale(.98)}
  .dOpts button b{font-size:14px}
  .dOpts button span{font-size:11.5px;opacity:.65}
  .dOpts button.special{border-color:rgba(200,107,255,.5);background:rgba(200,107,255,.08)}

  .btnBig{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#6c8cff,#a86bff);color:#fff;
    font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .1s,filter .2s}
  .btnBig:active{transform:scale(.97)}
  .btnBig:hover{filter:brightness(1.1)}

  .stats{display:flex;justify-content:center;gap:12px;margin-top:14px;font-size:12.5px;flex-wrap:wrap}
  .stats div{background:rgba(255,255,255,.05);padding:8px 12px;border-radius:12px}

  .story-log{margin-top:14px;font-size:12px;line-height:1.55}
  .story-log .item{display:flex;gap:8px;padding:8px 10px;margin-top:6px;
    background:rgba(255,255,255,.04);border-radius:10px;border-left:3px solid rgba(255,255,255,.15)}
  .story-log .item.saved{border-left-color:#3ddc97}
  .story-log .item.rules{border-left-color:#ff5d73}
  .story-log .item.used{border-left-color:#c86bff}
  .story-log .item.ignored{border-left-color:#666}

  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,22px);
    background:rgba(20,28,48,.96);border:1px solid rgba(120,150,255,.35);
    padding:12px 18px;border-radius:14px;font-size:13px;line-height:1.45;
    max-width:min(460px,92vw);text-align:center;opacity:0;pointer-events:none;
    transition:.3s;z-index:60}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.good{border-color:rgba(61,220,151,.5)}
  #toast.bad{border-color:rgba(255,93,115,.5)}
  #toast.magic{border-color:rgba(200,107,255,.55)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="levelChip">Ур 1/3</div>
    <div class="chip" id="levelName">Первый день</div>
    <div class="chip progress" id="progressChip">0/12</div>
    <div class="spacer"></div>
    <div class="chip" id="livesChip">❤️❤️❤️</div>
    <div class="chip gold" id="scoreChip">0</div>
  </div>
  <div id="beltArea">
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="heatBar"><div id="heatFill"></div></div>
    <div id="belt"></div>
    <div id="comboBadge"></div>
    <div id="whisperBtn">👁️</div>
    <div id="tutorialHint"></div>
  </div>
  <div id="bins"></div>
  <div id="toolBar"></div>
</div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>

<script>
/* ============================================================
   ПЕРСОНАЖИ
   ============================================================ */
const CHARACTERS = {
  sad_villain: {
    emoji:'🦹', name:'Грустный злодей', onBeltName:'Злодей',
    plea:'Пожалуйста… не в Опасное. У меня на руках котёнок. Он не переживёт конвейер.',
    options:[
      { flag:'rules', icon:'📋', label:'По правилам', desc:'+100 очков · Начальник одобряет',
        score:+100, time:0 },
      { flag:'saved', icon:'🕊', label:'Помочь', desc:'−50 очков · −10 секунд · Вернётся союзником',
        score:-50, time:-10 },
      { flag:'used', icon:'🌀', label:'Забрать котёнка', desc:'Злодей уйдёт с благодарностью',
        score:0, time:0 }
    ]
  },
  robot_kitten: {
    emoji:'🤖', name:'Робот-котёнок', onBeltName:'Робокот',
    plea:'Мяу. Я… я не знаю, что я. Техника или животное? Меня разберут, если я не впишусь.',
    options:[
      { flag:'rules', icon:'📋', label:'В «Технику»', desc:'+100 очков · Начальник одобряет',
        score:+100, time:0 },
      { flag:'saved', icon:'🕊', label:'Оставить как есть', desc:'−50 очков · −10 секунд · Станет помощником',
        score:-50, time:-10 },
      { flag:'used', icon:'🌀', label:'Разобрать на запчасти', desc:'+50 очков',
        score:+50, time:0 }
    ]
  }
};

/* ============================================================
   УРОВНИ
   ============================================================ */
const LEVELS = [
{
  name:'Первый день', duration:90, target:12, namedAfter:5,
  bins:[{id:'food',e:'🍽️',n:'Еда'},{id:'plant',e:'🌱',n:'Растения'},{id:'danger',e:'⚠️',n:'Опасное'}],
  pool:[
    {e:'🍌',n:'Банан',c:'food'},{e:'🌵',n:'Кактус',c:'plant'},{e:'🍎',n:'Яблоко',c:'food'},
    {e:'🌸',n:'Цветок',c:'plant'},{e:'🐍',n:'Змея',c:'danger'},{e:'🥕',n:'Морковь',c:'food'},
    {e:'🐝',n:'Оса',c:'danger'},{e:'🌷',n:'Тюльпан',c:'plant'},{e:'🍕',n:'Пицца',c:'food'},
    {e:'🦂',n:'Скорпион',c:'danger'}
  ],
  named:'sad_villain'
},
{
  name:'Робот-котёнок', duration:90, target:15, namedAfter:6,
  bins:[{id:'trash',e:'🗑️',n:'Мусор'},{id:'toy',e:'🧸',n:'Игрушки'},{id:'sweet',e:'🍬',n:'Сладости'}],
  pool:[
    {e:'🍬',n:'Конфета',c:'sweet'},{e:'🧻',n:'Бумага',c:'trash'},{e:'🧸',n:'Мишка',c:'toy'},
    {e:'🍭',n:'Леденец',c:'sweet'},{e:'🪀',n:'Йо-йо',c:'toy'},{e:'🥫',n:'Банка',c:'trash'},
    {e:'🍫',n:'Шоколад',c:'sweet'},{e:'📰',n:'Газета',c:'trash'},{e:'🪆',n:'Матрёшка',c:'toy'},
    {e:'🍩',n:'Пончик',c:'sweet'}
  ],
  named:'robot_kitten'
},
{
  name:'Инспекция', duration:100, target:18,
  bins:[{id:'animal',e:'🐾',n:'Животные'},{id:'plant',e:'🌿',n:'Растения'},{id:'tech',e:'⚙️',n:'Техника'}],
  pool:[
    {e:'🐶',n:'Собака',c:'animal'},{e:'🌿',n:'Папоротник',c:'plant'},{e:'📱',n:'Телефон',c:'tech'},
    {e:'🐱',n:'Кот',c:'animal'},{e:'🌳',n:'Дуб',c:'plant'},{e:'🚗',n:'Машина',c:'tech'},
    {e:'🐹',n:'Хомяк',c:'animal'},{e:'💻',n:'Ноутбук',c:'tech'},{e:'🌵',n:'Кактус',c:'plant'},
    {e:'🐢',n:'Черепаха',c:'animal'},{e:'📺',n:'Телевизор',c:'tech'},{e:'🍀',n:'Клевер',c:'plant'}
  ],
  hasWhisper:true, whisperAfter:4
}
];

/* ============================================================
   ВСТУПЛЕНИЕ (4 шага)
   ============================================================ */
const INTRO_SEQUENCE = [
  {
    emoji:'🏭',
    kicker:'Смена 7-го разряда',
    title:'Бюро Незавершённых Вещей',
    body:'Здесь заканчивают свой путь объекты, которые не вписались в реальность. Сломанные игрушки. Забытые идеи. Персонажи из недописанных книг. Эмоции, которые никто не испытал.',
    btn:'Кто я?'
  },
  {
    emoji:'👤',
    kicker:'Твоя роль',
    title:'Сортировщик 7-го разряда',
    body:'Ты только что устроился. Первый день. Твоя задача — брать объекты с конвейера и раскладывать их по контейнерам. Ошибка — минус жизнь. Успех — очки и признание Начальника.',
    btn:'А что за голос?'
  },
  {
    emoji:'🎧',
    kicker:'Голос в наушнике',
    title:'Начальник',
    speaker:'boss',
    body:'«Добро пожаловать, Сортировщик. Я буду следить за твоей сменой. Слушай меня — и всё будет хорошо. И вот что: иногда на ленте появляются «именные» объекты. Они будут говорить с тобой. Умолять. Не слушай их. Просто следуй правилам».',
    btn:'Правила'
  },
  {
    emoji:'📋',
    kicker:'Туториал',
    title:'Как играть',
    rules:[
      {icon:'👆', text:'Тапни объект на ленте → тапни нужный контейнер внизу. Или перетащи объект прямо в контейнер.'},
      {icon:'⏱', text:'Смена длится 90 секунд. Вверху — счётчик: сколько объектов осталось отсортировать.'},
      {icon:'🔥', text:'Лента перегревается от скопления объектов. Правильные ответы остужают её. Достигнет 100% — смена сорвана.'},
      {icon:'👻', text:'Фиолетовый объект — именной. Тапни его, чтобы услышать историю. Твой выбор изменит следующие уровни.'}
    ],
    btn:'Начать смену'
  }
];

/* ============================================================
   ЗАСТАВКИ ПЕРЕД УРОВНЯМИ 2 И 3
   ============================================================ */
const LEVEL_INTROS = {
  1: [
    {
      emoji:'🪢', kicker:'Новый инструмент', title:'Лассо',
      speaker:'boss',
      body:'«Держи. Если объект уезжает, а ты не успел — притяни его обратно. Один раз в 15 секунд. Не подведи».',
      btn:'Дальше'
    },
    {
      emoji:'🤖', kicker:'Среди обычных', title:'Что-то новое',
      body:'Среди привычных объектов ты замечаешь… что-то, что смотрит на тебя. У него есть имя. И, кажется, история.',
      btn:'Начать'
    }
  ],
  2: [
    {
      emoji:'📋', kicker:'Инспекция', title:'Начальник',
      speaker:'boss',
      body:'«Сегодня за тобой наблюдают. Куратор лично проверяет смену. Соблюдай правила. Не подведи. И… если что-то услышишь — не слушай. Это шум системы».',
      btn:'Дальше'
    },
    {
      emoji:'👁️', kicker:'Из угла', title:'Шёпот',
      speaker:'whisper',
      body:'«Псс… ты ведь не веришь ему. Я вижу. Хорошо. Тогда слушай. То, что ты отправляешь в контейнеры — не исчезает. Оно падает в Пустоту. Куратор собирает из этого оружие. Я покажу тебе. Тапни меня на ленте — и я расскажу».',
      btn:'Начать'
    }
  ]
};

/* ============================================================
   ИСТОРИЯ (флаги)
   ============================================================ */
const story = { sad_villain:null, robot_kitten:null, whisper:null };

/* ============================================================
   STATE
   ============================================================ */
const $ = id => document.getElementById(id);
const beltArea = $('beltArea');
const modal = $('modal');

const state = {
  levelIndex:0, level:null,
  score:0, lives:3, combo:0,
  timer:0, timerMax:0, heat:0,
  objects:[], selected:null,
  running:false, paused:false, levelEnded:false,
  spawnTimer:0, sortedCount:0, namedSpawned:false,
  toolCooldowns:{ lasso:0 },
  allyTimer:0, ghostTimer:0,
  whisperShown:false, whisperClicked:false
};

/* ============================================================
   HUD
   ============================================================ */
function updateHUD(){
  $('levelChip').textContent = `Ур ${state.levelIndex+1}/${LEVELS.length}`;
  $('levelName').textContent = state.level ? state.level.name : '—';
  $('progressChip').textContent = state.sortedCount + '/' + (state.level ? state.level.target : 0);
  $('livesChip').textContent = '❤️'.repeat(Math.max(0,state.lives)) + '🖤'.repeat(Math.max(0,3-state.lives));
  $('scoreChip').textContent = state.score;
  const pct = Math.max(0, Math.min(100, state.timer / state.timerMax * 100));
  const tf = $('timerFill');
  tf.style.width = pct + '%';
  tf.classList.toggle('low', state.timer < 15);
  const hf = $('heatFill');
  hf.style.width = state.heat + '%';
  hf.classList.toggle('warn', state.heat > 70);
}
function updateComboBadge(){
  const b = $('comboBadge');
  if(state.combo >= 2){
    b.textContent = 'x' + state.combo;
    b.classList.add('show');
    b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  } else b.classList.remove('show');
}

/* ============================================================
   BINS / TOOLS
   ============================================================ */
function renderBins(){
  const el = $('bins');
  el.innerHTML = state.level.bins.map(b=>`
    <div class="bin" data-id="${b.id}">
      <div class="bEm">${b.e}</div><div class="bNm">${b.n}</div>
    </div>`).join('');
  el.querySelectorAll('.bin').forEach(b=>{
    b.addEventListener('pointerdown', ev=>{ ev.preventDefault(); resolveBin(b.dataset.id); });
  });
}
function flashBin(id, cls){
  const b = document.querySelector(`.bin[data-id="${id}"]`);
  if(!b) return;
  b.classList.add(cls);
  setTimeout(()=>b.classList.remove(cls), 260);
}
function renderTools(){
  const tb = $('toolBar');
  tb.innerHTML = '';
  if(state.levelIndex >= 1){
    const lasso = document.createElement('div');
    lasso.className = 'tool ready';
    lasso.dataset.tool = 'lasso';
    lasso.innerHTML = `<div class="cd-fill" style="transform:scaleX(0)"></div><span class="label">🪢 Лассо</span>`;
    lasso.addEventListener('pointerdown', ()=> useTool('lasso'));
    tb.appendChild(lasso);
  }
}
function updateToolVisuals(){
  document.querySelectorAll('.tool').forEach(t => {
    const tool = t.dataset.tool;
    const cd = state.toolCooldowns[tool] || 0;
    const fill = t.querySelector('.cd-fill');
    if(cd > 0){
      t.classList.add('cooling'); t.classList.remove('ready');
      fill.style.transform = `scaleX(${cd / 15})`;
    } else {
      t.classList.remove('cooling'); t.classList.add('ready');
      fill.style.transform = 'scaleX(0)';
    }
  });
}
function useTool(tool){
  if(state.toolCooldowns[tool] > 0) return;
  if(tool === 'lasso'){
    const candidates = state.objects.filter(o=>!o.removed && !o.isNamed && !o.dragging);
    if(!candidates.length){ showToast('Нечего тянуть.', 'bad'); return; }
    candidates.sort((a,b)=> a.x - b.x);
    const target = candidates[0];
    target.x = beltArea.clientWidth * 0.4;
    target.el.style.transform = `translateX(${target.x}px)`;
    if(state.selected) state.selected.el.classList.remove('selected');
    state.selected = target;
    target.el.classList.add('selected');
    state.toolCooldowns.lasso = 15;
    showToast('🪢 Лассо! Объект притянут.', 'good');
  }
}

/* ============================================================
   DRAG
   ============================================================ */
function setupDrag(o){
  const el = o.el;
  let drag = null;
  el.addEventListener('pointerdown', e => {
    if(o.removed || state.paused || state.levelEnded) return;
    e.preventDefault(); e.stopPropagation();
    drag = { startX:e.clientX, startY:e.clientY, offsetX:0, offsetY:0, ghost:null, moved:false, pointerId:e.pointerId };
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.addEventListener('pointermove', e => {
    if(!drag) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    const dist = Math.hypot(dx, dy);
    if(!drag.moved && dist > 8){
      drag.moved = true;
      o.dragging = true;
      const rect = el.getBoundingClientRect();
      drag.offsetX = e.clientX - rect.left;
      drag.offsetY = e.clientY - rect.top;
      const ghost = el.cloneNode(true);
      Object.assign(ghost.style, {position:'fixed',left:rect.left+'px',top:rect.top+'px',
        width:rect.width+'px',height:rect.height+'px',margin:'0',transform:'none',
        zIndex:'1000',pointerEvents:'none',opacity:'0.95'});
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      el.style.opacity = '0.25';
      el.classList.remove('selected');
      if(state.selected === o) state.selected = null;
    }
    if(drag.moved && drag.ghost){
      drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
      drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';
      document.querySelectorAll('.bin').forEach(b => b.classList.remove('drop-hover'));
      const bin = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
      if(bin) bin.classList.add('drop-hover');
    }
  });
  const endDrag = (e) => {
    if(!drag) return;
    const d = drag; drag = null;
    try { el.releasePointerCapture(d.pointerId); } catch(err){}
    if(d.ghost) d.ghost.remove();
    el.style.opacity = '';
    o.dragging = false;
    document.querySelectorAll('.bin').forEach(b => b.classList.remove('drop-hover'));
    if(e.type === 'pointercancel') return;
    if(d.moved){
      const bin = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
      if(bin && !o.removed){
        if(state.selected && state.selected !== o) state.selected.el.classList.remove('selected');
        state.selected = o;
        el.classList.add('selected');
        resolveBin(bin.dataset.id);
      }
    } else {
      if(state.selected === o){ el.classList.remove('selected'); state.selected = null; }
      else {
        if(state.selected) state.selected.el.classList.remove('selected');
        state.selected = o; el.classList.add('selected');
      }
    }
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

function spawnObject(item){
  const w = beltArea.clientWidth;
  const el = document.createElement('div');
  el.className = 'obj';
  el.innerHTML = `<span class="em">${item.e}</span><span class="nm">${item.n}</span>`;
  el.style.transform = `translateX(${w}px)`;
  beltArea.appendChild(el);
  const o = { el, x:w, baseSpeed:w/5.5, data:item, removed:false, selected:false, dragging:false, isNamed:false };
  setupDrag(o);
  state.objects.push(o);
}

function spawnNamed(charId){
  const ch = CHARACTERS[charId];
  const w = beltArea.clientWidth;
  const el = document.createElement('div');
  el.className = 'obj named';
  el.innerHTML = `<span class="em">${ch.emoji}</span><span class="nm">${ch.onBeltName}</span>`;
  el.style.transform = `translateX(${w}px)`;
  beltArea.appendChild(el);
  const o = { el, x:w, baseSpeed:w/9, data:{e:ch.emoji,n:ch.onBeltName,c:'__named__'},
    removed:false, selected:false, dragging:false, isNamed:true, charId };
  el.addEventListener('pointerdown', e=>{
    if(state.paused || o.removed) return;
    e.preventDefault(); e.stopPropagation();
    openDilemma(charId, o);
  });
  state.objects.push(o);
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function update(dt){
  if(!state.level) return;

  // ПОБЕДА по цели
  if(state.sortedCount >= state.level.target){
    endLevel(true);
    return;
  }
  if(state.timer <= 0){ endLevel(false, 'Смена окончена'); return; }

  state.timer -= dt;
  for(const k in state.toolCooldowns){
    if(state.toolCooldowns[k] > 0) state.toolCooldowns[k] = Math.max(0, state.toolCooldowns[k] - dt);
  }
  updateToolVisuals();

  const onBelt = state.objects.filter(o=>!o.removed).length;
  if(onBelt >= 5) state.heat = Math.min(100, state.heat + dt * 6);
  else if(onBelt < 3) state.heat = Math.max(0, state.heat - dt * 4);
  if(state.heat >= 100){ endLevel(false, 'Перегрев!'); return; }

  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    if(!state.namedSpawned && state.sortedCount >= state.level.namedAfter && state.level.named){
      state.namedSpawned = true;
      spawnNamed(state.level.named);
      showToast('⚠️ Именной объект на ленте. Тапни его — но помни, что сказал Начальник.', 'magic');
    } else {
      const item = state.level.pool[Math.floor(Math.random()*state.level.pool.length)];
      spawnObject(item);
    }
    const progress = 1 - state.timer / state.timerMax;
    let interval = Math.max(0.7, 1.7 - progress * 0.7);
    interval *= (1 - state.combo * 0.05);
    state.spawnTimer = Math.max(0.45, interval);
  }

  const w = beltArea.clientWidth;
  const speedMul = 1 + (1 - state.timer/state.timerMax) * 0.6 + state.combo * 0.05;
  for(const o of state.objects){
    if(o.removed || o.selected || o.dragging) continue;
    o.x -= o.baseSpeed * speedMul * dt;
    o.el.style.transform = `translateX(${o.x}px)`;
    if(o.x < -95){
      o.removed = true;
      o.el.classList.add('miss');
      setTimeout(()=>o.el.remove(), 400);
      if(o.isNamed){ openDilemma(o.charId, o, true); return; }
      state.lives--;
      state.combo = 0;
      state.heat = Math.min(100, state.heat + 8);
      popup('−1 ❤️', o.x, 'bad');
      shake();
      updateHUD(); updateComboBadge();
      if(state.lives <= 0){ endLevel(false, 'Жизни кончились'); return; }
    }
  }
  beltArea.classList.toggle('hot', state.heat > 70 || onBelt > 6);
  state.objects = state.objects.filter(o => !o.removed || o.el.parentElement);

  // Последствия выборов на ур. 3
  if(state.levelIndex === 2){
    if(story.sad_villain === 'saved'){
      state.allyTimer += dt;
      if(state.allyTimer >= 15){
        state.allyTimer = 0;
        autoSortOne();
        showGhost('👻💚', 'Авто-сортировка злодея!', 'good');
      }
    }
    if(story.sad_villain === 'rules'){
      state.ghostTimer += dt;
      if(state.ghostTimer >= 12){
        state.ghostTimer = 0;
        state.timer -= 1.5;
        showGhost('👻💔', 'Призрак украл время', 'bad');
      }
    }
    if(state.level.hasWhisper && !state.whisperShown && state.sortedCount >= state.level.whisperAfter){
      state.whisperShown = true;
      $('whisperBtn').classList.add('show');
    }
  }

  // Туториал для уровня 1
  if(state.levelIndex === 0) updateTutorialHint();

  updateHUD();
}

function updateTutorialHint(){
  const el = $('tutorialHint');
  if(!el) return;
  let txt = '';
  let show = true;
  if(state.sortedCount >= 3) show = false;
  else if(state.sortedCount === 0 && state.objects.filter(o=>!o.removed).length === 0){
    txt = '⏳ Лента сейчас начнёт движение…';
  } else if(state.sortedCount === 0 && !state.selected){
    txt = '👆 Тапни объект на ленте, чтобы выбрать его';
  } else if(state.sortedCount === 0 && state.selected){
    txt = '📦 Теперь тапни правильный контейнер внизу';
  } else if(state.sortedCount === 1){
    txt = '✅ Отлично! Продолжай. Не дай объектам уехать за левый край.';
  } else if(state.sortedCount === 2){
    txt = '🔥 Правильные ответы подряд дают комбо и очки ×2, ×3…';
  }
  el.textContent = txt;
  el.style.opacity = show ? '.9' : '0';
}

function loop(t){
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  if(state.running && !state.paused && !state.levelEnded) update(dt);
  requestAnimationFrame(loop);
}

function autoSortOne(){
  const candidates = state.objects.filter(o=>!o.removed && !o.isNamed && !o.dragging);
  if(!candidates.length) return;
  const c = candidates[Math.floor(Math.random()*candidates.length)];
  c.removed = true;
  c.el.classList.add('sorted');
  setTimeout(()=>c.el.remove(), 400);
  state.score += 5;
  popup('+5', c.x, 'good');
}
function showGhost(emoji, text, cls){
  const g = document.createElement('div');
  g.className = 'ghost';
  g.textContent = emoji;
  g.style.left = '20px'; g.style.top = '50%';
  beltArea.appendChild(g);
  setTimeout(()=>{ g.style.opacity = '0'; setTimeout(()=>g.remove(), 400); }, 1200);
  showToast(text, cls);
}
function removeObject(o, cls){
  if(o.removed) return;
  o.removed = true;
  o.el.classList.remove('selected');
  o.el.classList.add(cls || 'sorted');
  setTimeout(()=>o.el.remove(), 400);
  if(state.selected === o) state.selected = null;
}
function popup(text, x, cls){
  const p = document.createElement('div');
  p.className = 'pop ' + cls;
  p.textContent = text;
  p.style.left = Math.max(4, Math.min(x, beltArea.clientWidth - 60)) + 'px';
  p.style.top = '30%';
  beltArea.appendChild(p);
  setTimeout(()=>p.remove(), 900);
}
function shake(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'), 320); }

/* ============================================================
   RESOLVE BIN
   ============================================================ */
function resolveBin(binId){
  if(state.paused || state.levelEnded) return;
  const o = state.selected;
  if(!o || o.removed){ flashBin(binId, 'err'); return; }
  if(o.isNamed){ openDilemma(o.charId, o); return; }
  if(o.data.c === binId){
    state.combo = Math.min(state.combo + 1, 5);
    const pts = 10 * state.combo;
    state.score += pts;
    state.sortedCount++;
    state.heat = Math.max(0, state.heat - 8);
    state.timer += 0.5;
    popup('+' + pts, o.x, 'good');
    flashBin(binId, 'hit');
    removeObject(o, 'sorted');
    updateComboBadge(); updateHUD();
  } else {
    state.combo = 0;
    state.lives--;
    state.heat = Math.min(100, state.heat + 12);
    state.timer -= 3;
    popup('−1 ❤️', o.x, 'bad');
    flashBin(binId, 'err');
    removeObject(o, 'wrong');
    shake();
    updateComboBadge(); updateHUD();
    if(state.lives <= 0) endLevel(false, 'Жизни кончились');
  }
}

/* ============================================================
   DILEMMA
   ============================================================ */
function openDilemma(charId, obj, forced){
  if(state.paused) return;
  state.paused = true;
  const ch = CHARACTERS[charId];
  const opts = ch.options.map(o=>`
    <button data-choice="${o.flag}" class="${o.flag==='used'?'special':''}">
      <b>${o.icon} ${o.label}</b><span>${o.desc}</span>
    </button>`).join('');
  showModal(`
    <div class="dEm">${ch.emoji}</div>
    <div class="dName">${forced ? 'Он уезжает… но ты слышишь его' : 'Именной объект'}</div>
    <div class="dTitle">${ch.name}</div>
    <div class="dPlea">«${ch.plea}»</div>
    <div class="dOpts">${opts}</div>
  `);
  document.querySelectorAll('#modal .dOpts button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const flag = b.dataset.choice;
      const choice = ch.options.find(x=>x.flag===flag);
      resolveDilemma(charId, choice, obj);
    });
  });
}
function resolveDilemma(charId, choice, obj){
  story[charId] = choice.flag;
  state.score += choice.score;
  if(choice.time) state.timer += choice.time;
  state.timer += 3;
  if(choice.flag === 'saved') showToast('🕊 ' + CHARACTERS[charId].name + ' остался с тобой.', 'good');
  else if(choice.flag === 'rules') showToast('📋 Отправлен по правилам. Начальник доволен.', 'bad');
  else showToast('🌀 Ты использовал его по-своему.', 'magic');
  if(obj) removeObject(obj, 'sorted');
  hideModal();
  state.paused = false;
  updateHUD(); updateComboBadge();
}

/* ============================================================
   MODAL / TOAST
   ============================================================ */
function showModal(html){ modal.innerHTML = `<div class="card">${html}</div>`; modal.classList.remove('hidden'); }
function hideModal(){ modal.classList.add('hidden'); }
let toastTimer = null;
function showToast(text, cls){
  const t = $('toast');
  t.textContent = text;
  t.className = 'show ' + (cls || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ''; }, 3600);
}

/* ============================================================
   ВСТУПЛЕНИЕ (пошагово)
   ============================================================ */
function runIntroSequence(onDone){
  let idx = 0;
  function showStep(){
    if(idx >= INTRO_SEQUENCE.length){ hideModal(); onDone(); return; }
    const step = INTRO_SEQUENCE[idx];
    idx++;
    let bodyHtml = '';
    if(step.rules){
      bodyHtml = `<div class="rules-list">${step.rules.map(r=>`
        <div class="rule"><span class="icon">${r.icon}</span><span>${r.text}</span></div>`).join('')}</div>`;
    } else {
      const cls = step.speaker === 'boss' ? 'speaker-boss' : step.speaker === 'whisper' ? 'speaker-whisper' : '';
      const speakerLabel = step.speaker === 'boss' ? '🎧 Начальник' : step.speaker === 'whisper' ? '👁️ Шёпот' : '';
      bodyHtml = `<div class="intro-body ${cls}">${speakerLabel ? `<div class="speaker-label">${speakerLabel}</div>` : ''}${step.body}</div>`;
    }
    const dots = INTRO_SEQUENCE.map((_, i) =>
      `<div class="dot ${i < idx-1 ? 'done' : i === idx-1 ? 'active' : ''}"></div>`).join('');
    showModal(`
      <div class="intro-emoji">${step.emoji}</div>
      <div class="intro-kicker">${step.kicker}</div>
      <div class="intro-title">${step.title}</div>
      ${bodyHtml}
      <div class="intro-progress">${dots}</div>
      <button class="btnBig" data-advance>${step.btn}</button>
    `);
    document.querySelector('[data-advance]').addEventListener('click', showStep);
  }
  showStep();
}

function runLevelIntro(levelIdx, onDone){
  const intros = LEVEL_INTROS[levelIdx];
  if(!intros || !intros.length){ onDone(); return; }
  let idx = 0;
  function showStep(){
    if(idx >= intros.length){ hideModal(); onDone(); return; }
    const step = intros[idx];
    idx++;
    const cls = step.speaker === 'boss' ? 'speaker-boss' : step.speaker === 'whisper' ? 'speaker-whisper' : '';
    const speakerLabel = step.speaker === 'boss' ? '🎧 Начальник' : step.speaker === 'whisper' ? '👁️ Шёпот' : '';
    showModal(`
      <div class="intro-emoji">${step.emoji}</div>
      <div class="intro-kicker">${step.kicker}</div>
      <div class="intro-title">${step.title}</div>
      <div class="intro-body ${cls}">${speakerLabel ? `<div class="speaker-label">${speakerLabel}</div>` : ''}${step.body}</div>
      <button class="btnBig" data-advance>${step.btn}</button>
    `);
    document.querySelector('[data-advance]').addEventListener('click', showStep);
  }
  showStep();
}

/* ============================================================
   END LEVEL
   ============================================================ */
function endLevel(win, reason){
  if(state.levelEnded) return;
  state.levelEnded = true;
  state.running = false;
  state.paused = true;
  state.objects.forEach(o=>{ if(o.el.parentElement) o.el.remove(); });
  state.objects = [];

  const last = state.levelIndex >= LEVELS.length - 1;

  if(!win){
    showModal(`
      <div class="dEm">💔</div>
      <div class="dTitle">${reason || 'Смена окончена'}</div>
      <div class="dText" style="text-align:center">Отсортировано: ${state.sortedCount}/${state.level.target}</div>
      <div class="stats"><div>Очки: <b>${state.score}</b></div></div>
      <button class="btnBig" id="retryBtn">Повторить смену</button>
    `);
    $('retryBtn').addEventListener('click', ()=>{ hideModal(); startLevel(); });
    return;
  }

  if(last){
    showModal(`
      <div class="dEm">🏁</div>
      <div class="dTitle">Конец прототипа</div>
      <div class="dText" style="text-align:left">
        Ты прошёл три смены. Вот что осталось после тебя:
      </div>
      ${storyLog()}
      <div class="dText" style="font-size:12px;opacity:.65;margin-top:14px;text-align:left">
        В полной версии: 10 уровней, призраки уничтоженных, инструменты, 6 концовок. Если хочешь — продолжаем.
      </div>
      <div class="stats"><div>Очки: <b>${state.score}</b></div></div>
      <button class="btnBig" id="againBtn">Сыграть снова</button>
    `);
    $('againBtn').addEventListener('click', ()=>{
      hideModal();
      story.sad_villain = null; story.robot_kitten = null; story.whisper = null;
      state.levelIndex = 0; state.score = 0;
      runIntroSequence(()=> startLevel());
    });
    return;
  }

  // Промежуточная победа
  let bossLine = '';
  if(state.levelIndex === 0) bossLine = '🎧 Начальник: «Хорошо. Один из объектов был… странным. Ты справился. Продолжай».';
  else if(state.levelIndex === 1) bossLine = '🎧 Начальник: «Завтра инспекция. Не подведи. И не слушай то, чего нет».';
  showModal(`
    <div class="dEm">🎉</div>
    <div class="dTitle">Смена закрыта</div>
    <div class="dText" style="text-align:center;opacity:.7">${state.level.name}</div>
    ${bossLine ? `<div class="intro-body speaker-boss" style="margin-top:12px"><div class="speaker-label">🎧 Начальник</div>${bossLine.replace(/^🎧 Начальник: /,'')}</div>` : ''}
    ${storyLog()}
    <div class="stats"><div>Очки: <b>${state.score}</b></div></div>
    <button class="btnBig" id="nextBtn">Следующая смена →</button>
  `);
  $('nextBtn').addEventListener('click', ()=>{
    hideModal();
    state.levelIndex++;
    runLevelIntro(state.levelIndex, ()=> startLevel());
  });
}

function storyLog(){
  const items = [];
  if(story.sad_villain) items.push({icon:'🦹', name:'Грустный злодей',
    val: story.sad_villain === 'saved' ? 'спасён и вернётся' : story.sad_villain === 'rules' ? 'уничтожен по правилам' : 'использован',
    cls: story.sad_villain});
  if(story.robot_kitten) items.push({icon:'🤖', name:'Робот-котёнок',
    val: story.robot_kitten === 'saved' ? 'оставлен как есть' : story.robot_kitten === 'rules' ? 'разобран по правилам' : 'на запчасти',
    cls: story.robot_kitten});
  if(story.whisper) items.push({icon:'👁️', name:'Шёпот',
    val: story.whisper === 'listened' ? 'выслушан' : story.whisper === 'reported' ? 'донесён Начальнику' : 'проигнорирован',
    cls: story.whisper === 'listened' ? 'saved' : story.whisper === 'reported' ? 'rules' : 'ignored'});
  if(!items.length) return '';
  return `<div class="story-log">${items.map(i=>`
    <div class="item ${i.cls}">${i.icon} <b>${i.name}</b> — ${i.val}</div>`).join('')}</div>`;
}

/* ============================================================
   START LEVEL (исправленный)
   ============================================================ */
function startLevel(){
  state.level = LEVELS[state.levelIndex];
  if(state.level.named) story[state.level.named] = null;

  state.objects.forEach(o=>{ if(o.el.parentElement) o.el.remove(); });
  state.objects = [];
  state.selected = null;
  state.lives = 3;
  state.combo = 0;
  state.timer = state.level.duration;
  state.timerMax = state.level.duration;
  state.heat = 0;
  state.spawnTimer = 0.6;
  state.sortedCount = 0;
  state.namedSpawned = false;
  state.toolCooldowns = { lasso:0 };
  state.allyTimer = 0; state.ghostTimer = 0;
  state.whisperShown = false; state.whisperClicked = false;
  $('whisperBtn').classList.remove('show');

  state.paused = false;
  state.levelEnded = false;
  state.running = true;

  renderBins();
  renderTools();
  updateHUD();
  updateComboBadge();
  updateToolVisuals();
  // Сброс туториала
  $('tutorialHint').textContent = '';
  $('tutorialHint').style.opacity = '0';
}

/* ============================================================
   INIT
   ============================================================ */
runIntroSequence(()=> startLevel());
requestAnimationFrame(loop);
</script>
</body>
</html>
