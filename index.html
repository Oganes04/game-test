<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>КОНВЕЙЕР — Бюро Незавершённых Вещей</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#16224a,#070a14 60%);
    color:#e8eeff;display:flex;justify-content:center;align-items:center;padding:8px;
    overflow:hidden;touch-action:manipulation;user-select:none}
  body.shake #app{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  body.horror{background:radial-gradient(1200px 800px at 50% -10%,#1a0d1a,#050208 60%)}
  #app{width:min(600px,100%);display:flex;flex-direction:column;gap:6px;position:relative}

  /* HUD */
  #hud{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px}
  .chip{background:rgba(255,255,255,.06);border:1px solid rgba(120,150,255,.2);
    padding:3px 8px;border-radius:9px;white-space:nowrap}
  .chip.gold{border-color:rgba(255,201,77,.4);color:#ffd166}
  .chip.progress{border-color:rgba(61,220,151,.4);color:#3ddc97}
  .chip.suspicion{border-color:rgba(255,93,115,.4);color:#ff5d73}
  .chip.light{border-color:rgba(255,230,150,.4);color:#ffe696}
  .spacer{flex:1}

  /* BELT */
  #beltArea{position:relative;height:190px;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#131a2e,#0b1020);
    border:1px solid rgba(120,150,255,.18);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);transition:box-shadow .3s,background .4s}
  #beltArea.hot{box-shadow:inset 0 0 80px rgba(255,93,115,.3),0 0 20px rgba(255,93,115,.3)}
  #beltArea.dark{background:linear-gradient(180deg,#05060c,#02030a)}
  #beltArea.dark #belt{opacity:.15}
  #belt{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px);
    animation:beltMove 1.1s linear infinite}
  @keyframes beltMove{to{background-position:-52px 0}}

  #timerBar{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(0,0,0,.4);z-index:10}
  #timerFill{height:100%;background:linear-gradient(90deg,#3ddc97,#6c8cff);transition:width .1s linear;width:100%}
  #timerFill.low{background:linear-gradient(90deg,#ff5d73,#ffc94d);animation:timerPulse .6s infinite}
  @keyframes timerPulse{50%{opacity:.6}}

  #heatBar{position:absolute;top:3px;left:0;right:0;height:3px;background:rgba(0,0,0,.4);z-index:10}
  #heatFill{height:100%;width:0%;background:linear-gradient(90deg,#ffc94d,#ff5d73);transition:width .15s}
  #heatFill.warn{animation:heatWarn .5s infinite}
  @keyframes heatWarn{50%{opacity:.55}}

  #lightBar{position:absolute;top:6px;left:0;right:0;height:3px;background:rgba(0,0,0,.4);z-index:10;display:none}
  #lightFill{height:100%;width:100%;background:linear-gradient(90deg,#ffe696,#ffc94d);transition:width .2s}
  #lightBar.show{display:block}

  #suspicionBar{position:absolute;top:6px;left:0;right:0;height:3px;background:rgba(0,0,0,.4);z-index:10;display:none}
  #suspicionFill{height:100%;width:0%;background:linear-gradient(90deg,#ff5d73,#c86bff);transition:width .2s}
  #suspicionBar.show{display:block}

  #comboBadge{position:absolute;top:16px;right:10px;font-size:20px;font-weight:900;
    color:#ffc94d;text-shadow:0 0 12px rgba(255,201,77,.9);
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
  #comboBadge.show{opacity:1}
  #comboBadge.bump{animation:comboBump .3s}
  @keyframes comboBump{50%{transform:scale(1.4)}}

  #tutorialHint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:11px;padding:5px 12px;border-radius:9px;
    background:rgba(20,28,48,.85);border:1px solid rgba(108,140,255,.35);
    white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:12;max-width:95%}

  .npc-corner{position:absolute;top:20px;left:12px;font-size:28px;cursor:pointer;
    z-index:15;opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s;
    filter:drop-shadow(0 0 12px rgba(200,107,255,.9));animation:npcFloat 2s ease-in-out infinite}
  .npc-corner.show{opacity:1;transform:scale(1)}
  .npc-corner::after{content:attr(data-hint);position:absolute;top:100%;left:0;
    font-size:9px;color:rgba(255,255,255,.5);white-space:nowrap;margin-top:2px}
  @keyframes npcFloat{50%{transform:translateY(-5px) scale(1.05)}}

  .obj{position:absolute;top:50%;left:0;margin-top:-38px;width:72px;height:78px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    cursor:pointer;will-change:transform;touch-action:none;
    transition:background .15s,border-color .15s,box-shadow .15s,opacity .3s,scale .3s}
  .obj .em{font-size:28px;line-height:1;pointer-events:none}
  .obj .nm{font-size:8px;opacity:.6;max-width:66px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;pointer-events:none}
  .obj.selected{border-color:#ffc94d;background:rgba(255,201,77,.13);
    box-shadow:0 0 0 2px rgba(255,201,77,.45),0 0 22px rgba(255,201,77,.35);z-index:5}
  .obj.named{border-color:#c86bff;background:rgba(200,107,255,.13);
    box-shadow:0 0 0 2px rgba(200,107,255,.4),0 0 26px rgba(200,107,255,.55);
    animation:namedPulse 1.4s ease-in-out infinite}
  @keyframes namedPulse{50%{box-shadow:0 0 0 4px rgba(200,107,255,.25),0 0 36px rgba(200,107,255,.85)}}
  .obj.ghost-obj{border-color:rgba(200,107,255,.45);
    background:rgba(200,107,255,.06);opacity:.75;
    animation:ghostFlicker 2.2s ease-in-out infinite}
  @keyframes ghostFlicker{50%{opacity:.45}}
  .obj.dark-invisible{opacity:.15}
  .obj.sorted{opacity:0;scale:.25;pointer-events:none}
  .obj.wrong{opacity:0;scale:.8;background:rgba(255,93,115,.25);border-color:#ff5d73;pointer-events:none}
  .obj.miss{opacity:0;scale:.6;pointer-events:none}

  #bins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .bin{position:relative;background:linear-gradient(180deg,#18213d,#101728);
    border:1px solid rgba(120,150,255,.25);border-radius:14px;padding:9px 3px;
    text-align:center;cursor:pointer;transition:transform .1s,border-color .2s,background .2s,opacity .2s}
  .bin:active{transform:scale(.95)}
  .bin .bEm{font-size:22px;line-height:1.1;pointer-events:none}
  .bin .bNm{font-size:10px;opacity:.8;margin-top:2px;pointer-events:none}
  .bin.hit{border-color:#3ddc97;background:linear-gradient(180deg,#16352b,#101728)}
  .bin.err{border-color:#ff5d73;background:linear-gradient(180deg,#33161f,#101728)}
  .bin.drop-hover{border-color:#ffc94d;background:linear-gradient(180deg,#3d3216,#101728);
    transform:scale(1.06);box-shadow:0 0 22px rgba(255,201,77,.5)}
  .bin.blocked{opacity:.35;cursor:not-allowed;filter:grayscale(1)}

  #toolBar{display:flex;gap:6px;justify-content:center;min-height:32px;flex-wrap:wrap}
  .tool{flex:0 0 auto;min-width:90px;padding:7px 11px;border-radius:10px;
    background:linear-gradient(180deg,#1a2240,#101728);
    border:1px solid rgba(120,150,255,.3);font-size:11px;cursor:pointer;
    display:flex;align-items:center;gap:5px;justify-content:center;
    transition:transform .1s,border-color .2s,opacity .2s;position:relative;overflow:hidden}
  .tool:active{transform:scale(.95)}
  .tool.ready{border-color:rgba(61,220,151,.5);box-shadow:0 0 8px rgba(61,220,151,.2)}
  .tool.cooling{opacity:.5;cursor:not-allowed}
  .tool .cd-fill{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:left;transition:transform .1s linear}
  .tool .label{position:relative;z-index:1}

  .pop{position:absolute;font-weight:800;font-size:14px;pointer-events:none;
    animation:popUp .9s ease-out forwards;text-shadow:0 0 12px currentColor;z-index:8}
  .pop.good{color:#3ddc97}
  .pop.bad{color:#ff5d73}
  @keyframes popUp{to{opacity:0;transform:translateY(-50px)}}

  .ghost-fx{position:absolute;font-size:22px;pointer-events:none;z-index:12;
    filter:drop-shadow(0 0 10px rgba(200,107,255,.7));transition:opacity .3s}

  #bossOrderBar{position:absolute;top:-1px;left:0;right:0;z-index:14;
    background:linear-gradient(180deg,rgba(255,201,77,.15),rgba(255,201,77,.05));
    border:1px solid rgba(255,201,77,.5);border-radius:0 0 12px 12px;
    padding:7px 12px;font-size:11.5px;display:flex;align-items:center;gap:8px;
    transform:translateY(-100%);transition:transform .35s;backdrop-filter:blur(6px)}
  #bossOrderBar.show{transform:translateY(0)}
  #bossOrderBar .icon{font-size:16px}
  #bossOrderBar .text{flex:1;color:#ffd166}
  #bossOrderBar .timer{font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}

  #modal{position:fixed;inset:0;background:rgba(4,7,15,.9);backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
  #modal.hidden{display:none}
  .card{width:min(490px,100%);max-height:92vh;overflow-y:auto;
    background:linear-gradient(180deg,#131c33,#0c1222);
    border:1px solid rgba(120,150,255,.28);border-radius:20px;padding:20px;
    animation:cardIn .3s ease-out}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
  .intro-emoji{font-size:52px;text-align:center;line-height:1;margin-bottom:6px;
    animation:emojiFloat 3s ease-in-out infinite}
  @keyframes emojiFloat{50%{transform:translateY(-5px)}}
  .intro-kicker{font-size:10px;text-align:center;opacity:.5;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:4px}
  .intro-title{font-size:20px;font-weight:900;text-align:center;line-height:1.2;
    background:linear-gradient(90deg,#a86bff,#6c8cff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .intro-body{font-size:13.5px;line-height:1.6;opacity:.85;margin-top:12px;
    padding:12px;background:rgba(255,255,255,.03);border-radius:10px;
    border-left:3px solid rgba(108,140,255,.5)}
  .intro-body.speaker-boss{border-left-color:rgba(255,201,77,.7);background:rgba(255,201,77,.05)}
  .intro-body.speaker-whisper{border-left-color:rgba(200,107,255,.7);background:rgba(200,107,255,.05);font-style:italic}
  .intro-body.speaker-curator{border-left-color:rgba(255,93,115,.7);background:rgba(255,93,115,.05)}
  .speaker-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;
    opacity:.65;margin-bottom:5px;font-weight:700}
  .speaker-boss .speaker-label{color:#ffc94d}
  .speaker-whisper .speaker-label{color:#c86bff}
  .speaker-curator .speaker-label{color:#ff5d73}
  .rules-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .rules-list .rule{display:flex;gap:9px;align-items:flex-start;
    background:rgba(255,255,255,.04);padding:9px 11px;border-radius:9px;font-size:12.5px;line-height:1.5}
  .rules-list .rule .icon{font-size:17px;flex-shrink:0}
  .intro-progress{display:flex;gap:5px;justify-content:center;margin-top:16px}
  .intro-progress .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);
    transition:background .2s,width .2s}
  .intro-progress .dot.active{background:#6c8cff;width:16px;border-radius:3px}
  .intro-progress .dot.done{background:rgba(108,140,255,.5)}

  .dEm{font-size:48px;text-align:center;line-height:1}
  .dName{font-size:11px;text-align:center;opacity:.55;margin-top:5px;
    letter-spacing:2px;text-transform:uppercase}
  .dTitle{font-size:18px;font-weight:800;text-align:center;margin-top:2px}
  .dPlea{font-size:13px;opacity:.85;text-align:left;margin-top:10px;line-height:1.6;
    font-style:italic;padding:11px;background:rgba(255,255,255,.04);border-radius:10px;
    border-left:3px solid rgba(200,107,255,.6);white-space:pre-line}
  .dText{font-size:13.5px;opacity:.85;margin-top:10px;line-height:1.6}
  .dOpts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .dOpts button{display:flex;flex-direction:column;gap:2px;text-align:left;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    color:#e8eeff;padding:10px 13px;border-radius:12px;font:inherit;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s}
  .dOpts button:hover{background:rgba(108,140,255,.15);border-color:rgba(108,140,255,.5)}
  .dOpts button:active{transform:scale(.98)}
  .dOpts button b{font-size:13.5px}
  .dOpts button span{font-size:11px;opacity:.65}
  .dOpts button.special{border-color:rgba(200,107,255,.5);background:rgba(200,107,255,.08)}
  .dOpts button.danger{border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.06)}
  .dOpts button.locked{opacity:.35;cursor:not-allowed;filter:grayscale(.7)}
  .dOpts button.secret{border-color:rgba(255,201,77,.6);background:rgba(255,201,77,.07);
    animation:secretGlow 2s ease-in-out infinite}
  @keyframes secretGlow{50%{box-shadow:0 0 18px rgba(255,201,77,.3)}}

  .btnBig{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:none;
    background:linear-gradient(135deg,#6c8cff,#a86bff);color:#fff;
    font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;
    transition:transform .1s,filter .2s}
  .btnBig:active{transform:scale(.97)}
  .btnBig:hover{filter:brightness(1.1)}
  .btnBig.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#e8eeff}
  .btnBig.ghost:hover{background:rgba(255,255,255,.06)}

  .stats{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:12px;flex-wrap:wrap}
  .stats div{background:rgba(255,255,255,.05);padding:7px 11px;border-radius:10px}

  .story-log{margin-top:12px;font-size:11.5px;line-height:1.5}
  .story-log .item{display:flex;gap:7px;padding:7px 9px;margin-top:5px;
    background:rgba(255,255,255,.04);border-radius:9px;border-left:3px solid rgba(255,255,255,.15)}
  .story-log .item.saved{border-left-color:#3ddc97}
  .story-log .item.rules{border-left-color:#ff5d73}
  .story-log .item.memory{border-left-color:#c86bff}
  .story-log .item.used{border-left-color:#c86bff}
  .story-log .item.ignored{border-left-color:#666}

  #storyOverlay{position:fixed;inset:0;z-index:200;background:#04060d;
    display:flex;align-items:center;justify-content:center;transition:opacity .6s;padding:20px}
  #storyOverlay.hidden{display:none}
  #storyOverlay.fadeout{opacity:0;pointer-events:none}
  .story-bg{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#0a1228,#02040a 70%)}
  .story-bg::before,.story-bg::after{content:'';position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(108,140,255,.18),transparent 70%);
    animation:storyFloat 12s ease-in-out infinite}
  .story-bg::before{width:380px;height:380px;left:-80px;top:-80px}
  .story-bg::after{width:460px;height:460px;right:-120px;bottom:-120px;animation-delay:-6s}
  @keyframes storyFloat{50%{transform:translate(50px,-35px) scale(1.15)}}
  .story-content{position:relative;max-width:520px;padding:22px;text-align:center;
    font-size:14.5px;line-height:1.75;z-index:1;max-height:92vh;overflow-y:auto}
  .story-line{opacity:0;animation:storyFadeIn .9s ease-out forwards;margin:8px 0}
  .story-line.title{font-size:22px;font-weight:900;color:#a86bff;letter-spacing:3px;
    margin-bottom:20px;text-transform:uppercase}
  .story-line.subtitle{font-size:12.5px;opacity:.6;letter-spacing:2px;margin-bottom:16px}
  .story-line.italic{font-style:italic;color:#b8c8ff}
  @keyframes storyFadeIn{to{opacity:1}}
  .story-skip{position:absolute;bottom:22px;right:22px;font-size:12px;opacity:.5;
    cursor:pointer;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
    transition:.2s;z-index:5;background:transparent;color:#e8eeff}
  .story-skip:hover{opacity:1;border-color:rgba(255,255,255,.4)}

  #finalOverlay{position:fixed;inset:0;z-index:210;background:#02040a;
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .8s}
  #finalOverlay.show{opacity:1;pointer-events:auto}
  .final-card{max-width:520px;width:100%;text-align:center;
    max-height:92vh;overflow-y:auto;padding:18px}
  .final-emoji{font-size:68px;line-height:1;margin-bottom:12px;
    animation:emojiFloat 4s ease-in-out infinite}
  .final-title{font-size:24px;font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,#a86bff,#6c8cff);-webkit-background-clip:text;
    background-clip:text;color:transparent;margin-bottom:18px;text-transform:uppercase}
  .final-text{font-size:14.5px;line-height:1.8;color:#e8eeff;
    padding:16px;background:rgba(255,255,255,.03);border-radius:12px;
    border-left:3px solid rgba(108,140,255,.5);text-align:left;margin-bottom:14px}
  .final-epilogue{font-size:12.5px;line-height:1.7;opacity:.75;
    padding:12px;background:rgba(255,255,255,.02);border-radius:10px;
    border-left:3px solid rgba(200,107,255,.4);text-align:left;font-style:italic}
  .final-epilogue .speaker-label{font-style:normal}

  #achievementStack{position:fixed;bottom:20px;right:20px;z-index:80;
    display:flex;flex-direction:column-reverse;gap:7px;pointer-events:none;max-width:260px}
  .achievement-pop{background:linear-gradient(135deg,#1a2240,#101728);
    border:1px solid rgba(255,201,77,.5);border-radius:11px;
    padding:9px 12px;display:flex;gap:9px;align-items:center;
    animation:achSlide .4s ease-out;box-shadow:0 0 18px rgba(255,201,77,.2)}
  @keyframes achSlide{from{transform:translateX(120%);opacity:0}}
  .achievement-pop .icon{font-size:22px}
  .achievement-pop .txt b{display:block;font-size:11.5px;color:#ffd166}
  .achievement-pop .txt span{font-size:10.5px;opacity:.7}

  #toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);
    background:rgba(20,28,48,.96);border:1px solid rgba(120,150,255,.35);
    padding:11px 16px;border-radius:12px;font-size:12.5px;line-height:1.45;
    max-width:min(440px,92vw);text-align:center;opacity:0;pointer-events:none;
    transition:.3s;z-index:60}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.good{border-color:rgba(61,220,151,.5)}
  #toast.bad{border-color:rgba(255,93,115,.5)}
  #toast.magic{border-color:rgba(200,107,255,.55)}
  #toast.boss{border-color:rgba(255,201,77,.6)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="levelChip">Ур 1/10</div>
    <div class="chip" id="levelName">Первый день</div>
    <div class="chip progress" id="progressChip">0/20</div>
    <div class="spacer"></div>
    <div class="chip suspicion" id="suspicionChip" style="display:none">Сомнение: 0%</div>
    <div class="chip light" id="lightChip" style="display:none">Свет: 100%</div>
    <div class="chip" id="livesChip">❤️❤️❤️</div>
    <div class="chip gold" id="scoreChip">0</div>
    <div class="chip" id="chipIcon" style="display:none" title="Чип памяти">💾</div>
  </div>
  <div id="beltArea">
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="heatBar"><div id="heatFill"></div></div>
    <div id="lightBar"><div id="lightFill"></div></div>
    <div id="suspicionBar"><div id="suspicionFill"></div></div>
    <div id="belt"></div>
    <div id="comboBadge"></div>
    <div id="bossOrderBar">
      <div class="icon">🎧</div>
      <div class="text" id="bossOrderText">Приказ</div>
      <div class="timer" id="bossOrderTimer">15s</div>
    </div>
    <div class="npc-corner" id="whisperNPC" data-hint="Шёпот">👁️</div>
    <div class="npc-corner" id="robotNPC" data-hint="Прототип">🤖</div>
    <div id="tutorialHint"></div>
  </div>
  <div id="bins"></div>
  <div id="toolBar"></div>
</div>
<div id="modal" class="hidden"></div>
<div id="finalOverlay">
  <div class="final-card" id="finalCard"></div>
</div>
<div id="achievementStack"></div>
<div id="toast"></div>

<script>
/* ============================================================
   ДАННЫЕ
   ============================================================ */

const CHARACTERS = {

function createStoryFlags(){
  return {
    sad_villain:null, robot_kitten:null,
    whisper:null, whisperListened:false, whisperSaved:false,
    misha:null, ex:null, shadow:null, curator:null, originalRobot:null,
    hasChip:false, secretPath:false, curatorWeak:false,
    trustBoss:0, trustWhisper:0, karma:0
  };
}

function checkSecretPath(){
  return story.robot_kitten === 'memory' &&
         story.whisperListened === true &&
         story.whisperSaved === true &&
         story.misha === 'chip' &&
         story.ex === 'talked' &&
         story.shadow === null &&
         story.originalRobot === 'taken';
}

function getLevelTools(levelIndex){
  const lv = LEVELS[levelIndex];
  const tools = [];
  if(levelIndex >= 1) tools.push('lasso');
  if(story.robot_kitten === 'saved') tools.push('purr');
  if(story.whisperSaved === true) tools.push('void');
  if(story.misha === 'gift') tools.push('laugh');
  if(story.shadow === 'freed') tools.push('doubt');
  return [...new Set(tools)];
}

function determineFinale(){
  const c = story.curator;
  if(c === 'secret') return 'secret';
  if(c === 'power') return story.curatorWeak ? 'power' : 'bureaucrat';
  if(c === 'free') return story.originalRobot === 'weapon' ? 'destruction' : 'savior';
  if(c === 'nothing') return 'nobody';
  return 'nobody';
}

function updateHUD(){

  $('levelChip').textContent = `Ур ${state.levelIndex+1}/${LEVELS.length}`;

  $('scoreChip').textContent = state.score;

  $('timerFill').style.width = Math.max(0, Math.min(100, state.timer / state.timerMax * 100)) + '%';
  $('timerFill').classList.toggle('low', state.timer < 15);

  $('heatFill').style.width = state.heat + '%';
  $('heatFill').classList.toggle('warn', state.heat > 70);

  const lb = $('lightBar'), lc = $('lightChip');
  if(lv.hasLight){

function renderTools(){

function updateToolVisuals(){
  toolBarEl.querySelectorAll('.tool').forEach(el => {
    const id = el.dataset.tool;
    const cd = state.toolCooldowns[id] || 0;
    const maxCd = TOOLS[id].cd;
    const fill = el.querySelector('.cd-fill');
    if(cd > 0){
      el.classList.add('cooling'); el.classList.remove('ready');
      fill.style.transform = `scaleX(${cd / maxCd})`;
    } else {
      el.classList.remove('cooling'); el.classList.add('ready');
      fill.style.transform = 'scaleX(0)';
    }
  });
}

function useTool(id){
  if(state.paused || state.levelEnded || !state.running) return;
  if(state.bossOrder && state.bossOrder.id === 'no_lasso') return;
  if((state.toolCooldowns[id] || 0) > 0) return;

  if(id === 'lasso'){
    const c = state.objects.filter(o=>!o.removed && !o.isNamed && !o.isGhost && !o.dragging);
    if(!c.length){ showToast('Нечего тянуть.', 'bad'); return; }
    c.sort((a,b)=> a.x - b.x);
    const target = c[0];
    target.x = beltArea.clientWidth * 0.4;
    target.el.style.transform = `translateX(${target.x}px)`;
    if(state.selected) state.selected.el.classList.remove('selected');
    state.selected = target; target.el.classList.add('selected');
    state.lassoCount++;
    if(state.lassoCount >= 10) unlockAchievement('lasso_master');
    showToast('🪢 Лассо!', 'good');
  }
  else if(id === 'purr'){ state.effects.slow = 5; showToast('🐱 Мурчание: −50% 5с', 'good'); }
  else if(id === 'void'){ state.effects.voidMode = 10; showToast('👁️ Голос Пустоты: ×3 очки 10с', 'magic'); }
  else if(id === 'laugh'){ state.effects.laugh = 5; showToast('🧒 Детский смех: призраки замерли', 'good'); }
  else if(id === 'doubt'){ state.effects.doubt = 8; showToast('🔮 Сомнение: вопросы сортируемы', 'magic'); }

  state.toolCooldowns[id] = TOOLS[id].cd;
  updateToolVisuals();
}

/* ============================================================
   SPAWN + DRAG
   ============================================================ */

function setupDrag(o){
  const el = o.el;
  let drag = null;
  el.addEventListener('pointerdown', e => {
    if(o.removed || state.paused || state.levelEnded) return;
    if(o.isNamed){ e.preventDefault(); e.stopPropagation(); openDilemma(o); return; }
    if(o.isGhost){
      e.preventDefault(); e.stopPropagation();
      state.lives--; state.combo = 0;
      if(state.level.hasSuspicion) state.suspicion = Math.min(100, state.suspicion+15);
      popup('Тень! −1 ❤️', o.x, 'bad'); shake();
      removeObject(o, 'wrong'); updateHUD(); updateComboBadge();
      if(state.lives <= 0) endLevel(false, 'Тени забрали тебя');
      return;
    }
    if(o.isQuestion && !(state.effects.doubt > 0)){
      e.preventDefault(); e.stopPropagation();
      openQuestion(o); return;
    }
    e.preventDefault(); e.stopPropagation();
    drag = { startX:e.clientX, startY:e.clientY, offsetX:0, offsetY:0, ghost:null, moved:false, pointerId:e.pointerId };
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.addEventListener('pointermove', e => {
    if(!drag) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if(!drag.moved && Math.hypot(dx,dy) > 8){
      drag.moved = true; o.dragging = true;
      const rect = el.getBoundingClientRect();
      drag.offsetX = e.clientX - rect.left; drag.offsetY = e.clientY - rect.top;
      const gh = el.cloneNode(true);
      Object.assign(gh.style, {position:'fixed', left:rect.left+'px', top:rect.top+'px',
        width:rect.width+'px', height:rect.height+'px', margin:'0', transform:'none',
        zIndex:'1000', pointerEvents:'none', opacity:'0.95'});
      document.body.appendChild(gh); drag.ghost = gh;
      el.style.opacity = '0.25'; el.classList.remove('selected');
      if(state.selected === o) state.selected = null;
    }
    if(drag.moved && drag.ghost){
      drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
      drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';
      binsEl.querySelectorAll('.bin').forEach(b => b.classList.remove('drop-hover'));
      const bin = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
      if(bin) bin.classList.add('drop-hover');
    }
  });
  const endDrag = (e) => {
    if(!drag) return;
    const d = drag; drag = null;
    try { el.releasePointerCapture(d.pointerId); } catch(err){}
    if(d.ghost) d.ghost.remove();
    el.style.opacity = ''; o.dragging = false;
    binsEl.querySelectorAll('.bin').forEach(b => b.classList.remove('drop-hover'));
    if(e.type === 'pointercancel') return;
    if(d.moved){
      const bin = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
      if(bin && !o.removed){
        if(state.selected && state.selected !== o) state.selected.el.classList.remove('selected');
        state.selected = o; el.classList.add('selected');
        resolveBin(bin.dataset.id);
      }
    } else {
      if(state.selected === o){ el.classList.remove('selected'); state.selected = null; }
      else {
        if(state.selected) state.selected.el.classList.remove('selected');
        state.selected = o; el.classList.add('selected');
      }
    }
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */

let lastTime = performance.now();

function loop(t){
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  if(state.running && !state.paused && !state.levelEnded) update(dt);
  requestAnimationFrame(loop);
}

function update(dt){
  if(!state.level) return;

  if(state.level.id !== 10 && state.sortedCount >= state.level.target){
    endLevel(true); return;
  }
  if(state.timer <= 0){ endLevel(false, 'Смена окончена'); return; }

  state.timer -= dt;

  for(const k in state.toolCooldowns){
    if(state.toolCooldowns[k] > 0) state.toolCooldowns[k] = Math.max(0, state.toolCooldowns[k] - dt);
  }
  updateToolVisuals();

  for(const k in state.effects){
    if(state.effects[k] > 0) state.effects[k] = Math.max(0, state.effects[k] - dt);
  }

  const onBelt = state.objects.filter(o=>!o.removed).length;
  if(onBelt >= 5) state.heat = Math.min(100, state.heat + dt * 6);
  else if(onBelt < 3) state.heat = Math.max(0, state.heat - dt * 4);
  if(state.heat >= 100){ endLevel(false, 'Перегрев!'); return; }

  if(state.level.hasLight && state.lightZeroTimer > 0){
    state.lightZeroTimer -= dt;
    if(state.lightZeroTimer <= 0) beltArea.classList.remove('dark');
  }
  if(state.level.hasLight){
    state.objects.forEach(o => {
      if(o.removed) return;
      o.el.classList.toggle('dark-invisible', state.light < 20);
    });
  }

  if(state.level.bossOrders > 0 && !state.bossOrder){
    state.nextOrderAt -= dt;
    if(state.nextOrderAt <= 0 && state.bossOrdersLeft > 0) triggerBossOrder();
  }
  if(state.bossOrder){
    state.bossOrderTimer -= dt;
    $('bossOrderTimer').textContent = Math.max(0, Math.ceil(state.bossOrderTimer)) + 's';
    if(state.bossOrderTimer <= 0) endBossOrder(false);
  }

  state.spawnTimer -= dt;
  if(state.spawnTimer <= 0){
    trySpawn();
    const progress = 1 - state.timer / state.timerMax;
    let interval = Math.max(0.7, 1.9 - progress * 0.8);
    interval *= (1 - state.combo * 0.05);
    if(state.effects.slow > 0) interval *= 1.5;
    if(state.effects.fast > 0) interval *= 0.6;
    if(state.bossOrder && state.bossOrder.id === 'speed_2x') interval *= 0.5;
    state.spawnTimer = Math.max(0.4, interval);
  }

  const w = beltArea.clientWidth;
  const speedMul = (state.level.speedMul || 1) *
                   (1 + (1 - state.timer/state.timerMax) * 0.6 + state.combo * 0.05) *
                   (state.effects.slow > 0 ? 0.5 : 1) *
                   (state.effects.fast > 0 ? 1.5 : 1) *
                   (state.bossOrder && state.bossOrder.id === 'speed_2x' ? 2 : 1);

  for(const o of state.objects){
    if(o.removed || o.selected || o.dragging) continue;
    o.x -= o.baseSpeed * speedMul * dt;
    o.el.style.transform = `translateX(${o.x}px)`;
    if(o.x < -90){
      o.removed = true;
      o.el.classList.add('miss');
      setTimeout(()=>o.el.remove(), 400);
      if(o.isNamed){ openDilemma(o, true); return; }
      if(o.isGhost) continue;
      state.combo = 0;
      if(state.level.hasSuspicion){ state.suspicion = Math.min(100, state.suspicion+15); }
      else { state.lives--; state.heat = Math.min(100, state.heat + 8); }
      popup('−1 ❤️', o.x, 'bad'); shake();
      updateHUD(); updateComboBadge();
      if(state.lives <= 0){ endLevel(false, 'Жизни кончились'); return; }
      if(state.suspicion >= 100){ endLevel(false, 'Сомнение поглотило тебя'); return; }
    }
  }
  beltArea.classList.toggle('hot', state.heat > 70 || onBelt > 6);
  state.objects = state.objects.filter(o => !o.removed || o.el.parentElement);

  updateGhostsAndAllies(dt);
  checkNPC();
  if(state.levelIndex === 0) updateTutorialHint();
  updateHUD();
}

function trySpawn(){
  const lv = state.level;
  if(lv.named && lv.named.length){
    for(const n of lv.named){
      if(!state.namedSpawned[n.id] && state.sortedCount >= n.after){
        state.namedSpawned[n.id] = true;
        spawnNamed(n.id);
        return;
      }
    }
  }
  if(lv.ghostMode === 'shadows' && Math.random() < 0.25){
    const src = lv.pool[Math.floor(Math.random()*lv.pool.length)];
    spawnObject({e:src.e, n:'???', c:'__shadow__'}, {isGhost:true});
    return;
  }
  if(lv.hasSuspicion && Math.random() < 0.2){
    const qs = [
      {e:'🌀', n:'Вопрос', c:'chaos'},
      {e:'🔮', n:'Сомнение', c:'chaos'},
      {e:'⚖️', n:'Выбор', c:'chaos'},
      {e:'❓', n:'Зачем?', c:'chaos'}
    ];
    spawnObject(qs[Math.floor(Math.random()*qs.length)], {isQuestion:true});
    return;
  }
  const item = lv.pool[Math.floor(Math.random()*lv.pool.length)];
  spawnObject(item);
}

/* ============================================================
   SORTING
   ============================================================ */

function resolveBin(binId){
  if(state.paused || state.levelEnded || !state.running) return;

  if(state.bossOrder && state.bossOrder.id === 'only_red'){
    if(binId !== state.level.bins[0].id){ flashBin(binId, 'err'); return; }
  }
  if(state.bossOrder && state.bossOrder.id === 'center_bin'){
    if(binId !== state.level.bins[1].id){ flashBin(binId, 'err'); return; }
    const o = state.selected;
    if(!o || o.removed){ flashBin(binId, 'err'); return; }
    state.score += 5; state.sortedCount++; state.combo = 0;
    popup('+5', o.x, 'good'); removeObject(o, 'sorted');
    state.fulfilledOrders++;
    if(state.fulfilledOrders >= 10) unlockAchievement('faithful');
    updateComboBadge(); updateHUD();
    return;
  }

  const o = state.selected;
  if(!o || o.removed){ flashBin(binId, 'err'); return; }
  if(o.isNamed){ openDilemma(o); return; }
  if(o.isGhost) return;

  if(o.data.c === binId){
    state.combo = Math.min(state.combo + 1, 5);
    if(state.combo > state.maxCombo) state.maxCombo = state.combo;
    let pts = 10 * state.combo;
    if(state.effects.voidMode > 0) pts *= 3;
    state.score += pts;
    state.sortedCount++;
    state.heat = Math.max(0, state.heat - 8);
    state.timer += 0.5;
    if(state.level.hasLight) state.light = Math.min(100, state.light + 5);
    popup('+' + pts, o.x, 'good');
    flashBin(binId, 'hit');
    removeObject(o, 'sorted');
    updateComboBadge(); updateHUD();
  } else {
    state.combo = 0;
    state.heat = Math.min(100, state.heat + 12);
    state.timer -= 3;
    if(state.level.hasSuspicion){ state.suspicion = Math.min(100, state.suspicion + 12); }
    else { state.lives--; }
    if(state.level.hasLight){
      state.light = Math.max(0, state.light - 10);
      if(state.light <= 0){ beltArea.classList.add('dark'); state.lightZeroTimer = 3;
        showToast('🌑 Свет погас!', 'bad'); }
    }
    popup('−1 ❤️', o.x, 'bad');
    flashBin(binId, 'err');
    removeObject(o, 'wrong');
    shake();
    updateComboBadge(); updateHUD();
    if(state.lives <= 0) endLevel(false, 'Жизни кончились');
    else if(state.suspicion >= 100) endLevel(false, 'Сомнение поглотило тебя');
  }
}

/* ============================================================
   DILEMMA
   ============================================================ */

function openDilemma(obj, forced){
  if(state.paused) return;
  state.paused = true;
  if(state.selected && state.selected !== obj && state.selected.el){
    state.selected.el.classList.remove('selected');
  }
  state.selected = null;
  const charId = obj.charId;
  let ch = CHARACTERS[charId];
  if(!ch){ state.paused = false; return; }

  let opts = ch.options.slice();

  if(charId === 'whisper' && story.whisper === 'reported'){
    ch = { ...ch,
      plea:'Ты сдал меня. Я знал. Теперь я — враг. Уничтожь меня. Или используй. Но я не помогу.',
      options:[
        { flag:'reported', icon:'📢', label:'Донести снова', desc:'+200 очков', score:+200 },
        { flag:'used', icon:'🌀', label:'Уничтожить', desc:'+100 очков, но −1 жизнь', score:+100, lives:-1 }
      ]};
    opts = ch.options;
  }

  if(charId === 'misha'){
    opts = opts.map(o => ({...o, locked:
      (o.requires === 'robot_saved' && story.robot_kitten !== 'saved') ||
      (o.requires === 'has_chip' && !story.hasChip)
    }));
  }

  if(charId === 'shadow' && story.ex === 'talked'){
    opts.push({ flag:'skipped', icon:'🚶', label:'Пройти мимо', desc:'Скрытый путь', score:0 });
  }

  if(charId === 'curator_final'){
    const sp = checkSecretPath();
    opts = opts.map(o => ({...o, locked:
      (o.requires === 'whisper_saved_or_shadow_freed' && !(story.whisperSaved || story.shadow === 'freed')) ||
      (o.requires === 'secret_path' && !sp)
    }));
  }

  const optsHtml = opts.map(o => {
    const extraCls = (o.flag === 'used' || o.flag === 'destroyed' || o.flag === 'merged') ? 'special' : '';
    const secretCls = (o.requires === 'secret_path') ? 'secret' : '';
    const lockedCls = o.locked ? 'locked' : '';
    return `<button data-flag="${o.flag}" class="${extraCls} ${secretCls} ${lockedCls}">
      <b>${o.icon} ${o.label}</b><span>${o.desc}</span>
    </button>`;
  }).join('');

  showModal(`
    <div class="dEm">${ch.emoji}</div>
    <div class="dName">${forced ? 'Он уезжает…' : 'Именной объект'}</div>
    <div class="dTitle">${ch.name}</div>
    <div class="dPlea">«${ch.plea}»</div>
    <div class="dOpts">${optsHtml}</div>
  `);

  modal.querySelectorAll('.dOpts button').forEach(btn => {
    btn.addEventListener('click', () => {
      const flag = btn.dataset.flag;
      const choice = opts.find(x=>x.flag===flag);
      if(!choice) return;
      if(choice.locked){
        if(choice.requires === 'robot_saved') showToast('Нужен спасённый котёнок', 'bad');
        else if(choice.requires === 'has_chip') showToast('Нужен чип памяти', 'bad');
        else if(choice.requires === 'whisper_saved_or_shadow_freed') showToast('Нужен спасённый Шёпот или освобождённая Тень', 'bad');
        else if(choice.requires === 'secret_path') showToast('Этот путь закрыт', 'bad');
        return;
      }
      resolveDilemma(charId, choice, obj);
    });
  });
}

function resolveDilemma(charId, choice, obj){
  if(choice.score) state.score += choice.score;
  if(choice.time) state.timer += choice.time;
  if(choice.lives) state.lives += choice.lives;
  if(choice.trustBoss) story.trustBoss += choice.trustBoss;
  if(choice.trustWhisper) story.trustWhisper += choice.trustWhisper;
  if(choice.givesChip){ story.hasChip = true; unlockAchievement('chip'); }
  if(choice.curatorWeak) story.curatorWeak = true;

  if(charId === 'sad_villain' || charId === 'robot_kitten'){
    story[charId] = choice.flag;
    if(charId === 'sad_villain'){
      if(choice.flag === 'saved') unlockAchievement('saved_villain');
      if(choice.flag === 'rules') unlockAchievement('killed_villain');
    }
  }
  if(charId === 'misha'){ story.misha = choice.flag; }
  if(charId === 'ex'){ story.ex = choice.flag; if(choice.flag === 'talked') unlockAchievement('let_go'); }
  if(charId === 'whisper'){
    if(choice.flag === 'saved'){ story.whisperSaved = true; story.whisper = 'saved'; unlockAchievement('ghost_friend'); }
    else if(choice.flag === 'reported'){ story.whisper = 'reported'; unlockAchievement('snitch'); }
    else { story.whisper = story.whisper || choice.flag; }
  }
  if(charId === 'shadow'){
    story.shadow = choice.flag === 'skipped' ? null : choice.flag;
    if(choice.flag === 'freed') unlockAchievement('shadow_freed');
  }

  story.secretPath = checkSecretPath();
  if(story.secretPath) unlockAchievement('secret');

  if(charId === 'curator_final' || charId === 'curator'){
    story.curator = choice.flag;
    if(obj) removeObject(obj, 'sorted');
    hideModal(); state.paused = false;
    setTimeout(()=> endLevel(true), 500);
    return;
  }

  let toastText = '', toastCls = 'good';
  if(choice.flag === 'saved'){ toastText = '🕊 ' + CHARACTERS[charId].name + ' остался с тобой'; }
  else if(choice.flag === 'rules'){ toastText = '📋 Отправлен по правилам'; toastCls = 'bad'; }
  else if(choice.flag === 'memory'){ toastText = '💾 Чип памяти получен'; toastCls = 'magic'; }
  else if(choice.flag === 'used'){ toastText = '🌀 Использован'; toastCls = 'magic'; }
  else if(choice.flag === 'reported'){ toastText = '📢 Донесено'; }
  else if(choice.flag === 'gift' || choice.flag === 'chip'){ toastText = '🧒 Миша улыбнулся'; toastCls = 'magic'; }
  else if(choice.flag === 'talked'){ toastText = '💔 Она ушла спокойно'; toastCls = 'magic'; }
  else if(choice.flag === 'kept'){ toastText = '🌀 Она осталась'; toastCls = 'magic'; }
  else if(choice.flag === 'freed'){ toastText = '🔮 Тень освобождена'; toastCls = 'magic'; }
  else if(choice.flag === 'merged'){ toastText = '🔮 Слияние'; toastCls = 'bad'; }
  else if(choice.flag === 'destroyed'){ toastText = '💥 Тень уничтожена'; toastCls = 'bad'; }
  else if(choice.flag === 'skipped'){ toastText = '🚶 Ты прошёл мимо'; }
  if(toastText) showToast(toastText, toastCls);

  if(charId === 'misha' && choice.flag === 'gift' &&
     story.robot_kitten === 'saved' && story.originalRobot === 'taken'){
    unlockAchievement('father_son');
  }

  if(obj) removeObject(obj, 'sorted');
  hideModal(); state.paused = false;
  updateHUD(); updateComboBadge();
}

function openQuestion(obj){
  if(state.paused) return;
  state.paused = true;
  if(state.selected && state.selected.el){
    state.selected.el.classList.remove('selected');
  }
  state.selected = null;
  showModal(`
    <div class="dEm">🌀</div>
    <div class="dTitle">Объект-вопрос</div>
    <div class="dPlea">«Зачем ты это делаешь?» — спрашивает он. Правил больше нет. Что ты ответишь?</div>
    <div class="dOpts">
      <button data-q="any"><b>📋 Отправить в любой</b><span>−50 очков · +5 сомнения</span></button>
      <button data-q="destroy"><b>💥 Уничтожить</b><span>+15 сомнения · очистить ленту</span></button>
      <button data-q="ignore"><b>🚶 Пропустить</b><span>Он уедет. +5 сомнения</span></button>
    </div>
  `);
  modal.querySelectorAll('[data-q]').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.q;
      if(a === 'any'){ state.score -= 50; state.suspicion = Math.min(100, state.suspicion+5); }
      else if(a === 'destroy'){
        state.suspicion = Math.min(100, state.suspicion+15);
        state.objects.forEach(o => { if(!o.removed && o !== obj && !o.isNamed){ o.removed = true; o.el.remove(); } });
      }
      else if(a === 'ignore'){ state.suspicion = Math.min(100, state.suspicion+5); }
      removeObject(obj, 'sorted');
      hideModal(); state.paused = false; updateHUD();
      if(state.suspicion >= 100) endLevel(false, 'Сомнение поглотило тебя');
    });
  });
}

   GHOSTS / ALLIES
   ============================================================ */

function updateGhostsAndAllies(dt){
  if(state.level.ghostMode !== 'memories' && state.level.ghostMode !== 'final') return;
  if(state.effects.laugh > 0) return;

  if(story.sad_villain === 'rules'){
    state.ghostTimers.villain = (state.ghostTimers.villain || 0) + dt;
    if(state.ghostTimers.villain >= 12){
      state.ghostTimers.villain = 0;
      state.timer -= 1.5;
      showGhostFx('👻💔', 'Призрак злодея украл время', 'bad');
    }
  } else if(story.sad_villain === 'saved'){
    state.ghostTimers.villain = (state.ghostTimers.villain || 0) + dt;
    if(state.ghostTimers.villain >= 15){ state.ghostTimers.villain = 0; autoSortOne('Союзник-злодей'); }
  }
  if(story.robot_kitten === 'rules'){
    state.ghostTimers.kitten = (state.ghostTimers.kitten || 0) + dt;
    if(state.ghostTimers.kitten >= 10){
      state.ghostTimers.kitten = 0;
      const c = state.objects.filter(o=>!o.removed && !o.isNamed && !o.isGhost && !o.dragging);
      if(c.length){
        const t = c[Math.floor(Math.random()*c.length)];
        t.removed = true; t.el.remove();
        showGhostFx('👻🤖', 'Призрак котёнка забрал объект', 'bad');
      }
    }
  } else if(story.robot_kitten === 'saved'){
    state.ghostTimers.kitten = (state.ghostTimers.kitten || 0) + dt;
    if(state.ghostTimers.kitten >= 20){ state.ghostTimers.kitten = 0; autoSortOne('Союзник-котёнок'); }
  }
}

function autoSortOne(label){
  const c = state.objects.filter(o=>!o.removed && !o.isNamed && !o.isGhost && !o.dragging);
  if(!c.length) return;
  const t = c[Math.floor(Math.random()*c.length)];
  t.removed = true; t.el.classList.add('sorted');
  setTimeout(()=>t.el.remove(), 400);
  state.score += 5;
  popup('+5', t.x, 'good');
  showGhostFx('👻💚', label + ': авто-сортировка', 'good');
}

/* ============================================================
   BOSS ORDERS
   ============================================================ */

function triggerBossOrder(){
  if(state.bossOrdersLeft <= 0 || state.bossOrder) return;
  const order = BOSS_ORDERS[Math.floor(Math.random() * BOSS_ORDERS.length)];
  state.bossOrder = order;
  state.bossOrderTimer = order.duration;
  state.bossOrdersLeft--;
  state.nextOrderAt = 25 + Math.random() * 15;

  $('bossOrderText').textContent = order.text;
  $('bossOrderTimer').textContent = order.duration + 's';
  $('bossOrderBar').classList.add('show');

  if(order.id === 'only_red'){
    const firstBin = state.level.bins[0].id;
    binsEl.querySelectorAll('.bin').forEach(b => {
      if(b.dataset.id !== firstBin) b.classList.add('blocked');
    });
  }
  if(order.id === 'center_bin'){
    const secondBin = state.level.bins[1].id;
    binsEl.querySelectorAll('.bin').forEach(b => {
      if(b.dataset.id !== secondBin) b.classList.add('blocked');
    });
  }
  if(order.id === 'dark') beltArea.classList.add('dark');

  showToast('🎧 ' + order.text, 'boss');
}

function endBossOrder(failed){
  if(!state.bossOrder) return;
  const order = state.bossOrder;
  if(failed){
    state.sabotagedOrders++;
    if(state.sabotagedOrders >= 5) unlockAchievement('rebel');
    showToast('🎧 Приказ провален', 'bad');
    state.lives--;
  } else {
    state.fulfilledOrders++;
    if(state.fulfilledOrders >= 10) unlockAchievement('faithful');
    showToast('🎧 Приказ выполнен', 'boss');
  }
  state.bossOrder = null;
  $('bossOrderBar').classList.remove('show');
  binsEl.querySelectorAll('.bin').forEach(b => b.classList.remove('blocked'));
  beltArea.classList.remove('dark');
  if(state.lives <= 0) endLevel(false, 'Начальник уволил тебя');
}

/* ============================================================
   TUTORIAL
   ============================================================ */

function updateTutorialHint(){
  const el = $('tutorialHint');
  if(state.sortedCount >= 4){ el.style.opacity = '0'; return; }
  let txt = '';
  if(state.sortedCount === 0 && !state.selected && state.objects.filter(o=>!o.removed).length === 0){
    txt = '⏳ Лента сейчас начнёт движение…';
  } else if(state.sortedCount === 0 && !state.selected){
    txt = '👆 Тапни объект, чтобы выбрать';
  } else if(state.sortedCount === 0 && state.selected){
    txt = '📦 Теперь тапни правильный контейнер';
  } else if(state.sortedCount === 1){
    txt = '✅ Отлично! Не дай объектам уехать за край';
  } else if(state.sortedCount === 2){
    txt = '🔥 Комбо даёт ×2, ×3…';
  } else if(state.sortedCount === 3){
    txt = '👻 Фиолетовый — именной. Тапни, чтобы услышать историю';
  }
  el.textContent = txt;
  el.style.opacity = txt ? '.9' : '0';
}

/* ============================================================
   MODAL
   ============================================================ */

function showModal(html){ modal.innerHTML = `<div class="card">${html}</div>`; modal.classList.remove('hidden'); }
function hideModal(){ modal.classList.add('hidden'); }

/* ============================================================
   INTRO SEQUENCES
   ============================================================ */

function runIntroSequence(onDone){
  let idx = 0;
  function showStep(){
    if(idx >= INTRO_SEQUENCE.length){ hideModal(); onDone(); return; }
    const step = INTRO_SEQUENCE[idx]; idx++;
    let bodyHtml = '';
    if(step.rules){
      bodyHtml = `<div class="rules-list">${step.rules.map(r =>
        `<div class="rule"><span class="icon">${r.icon}</span><span>${r.text}</span></div>`).join('')}</div>`;
    } else {
      const cls = step.speaker === 'boss' ? 'speaker-boss'
                : step.speaker === 'whisper' ? 'speaker-whisper' : '';
      const lbl = step.speaker === 'boss' ? '🎧 Начальник'
                : step.speaker === 'whisper' ? '👁️ Шёпот' : '';
      bodyHtml = `<div class="intro-body ${cls}">${lbl ? `<div class="speaker-label">${lbl}</div>` : ''}${step.body}</div>`;
    }
    const dots = INTRO_SEQUENCE.map((_, i) =>
      `<div class="dot ${i < idx-1 ? 'done' : i === idx-1 ? 'active' : ''}"></div>`).join('');
    showModal(`
      <div class="intro-emoji">${step.emoji}</div>
      <div class="intro-kicker">${step.kicker}</div>
      <div class="intro-title">${step.title}</div>
      ${bodyHtml}
      <div class="intro-progress">${dots}</div>
      <button class="btnBig" data-advance>${step.btn}</button>
    `);
    modal.querySelector('[data-advance]').addEventListener('click', showStep);
  }
  showStep();
}

function runLevelIntro(levelId, onDone){
  const intros = LEVEL_INTROS[levelId];
  if(!intros || !intros.length){ onDone(); return; }
  let idx = 0;
  function showStep(){
    if(idx >= intros.length){ hideModal(); onDone(); return; }
    const step = intros[idx]; idx++;
    const cls = step.speaker === 'boss' ? 'speaker-boss'
              : step.speaker === 'whisper' ? 'speaker-whisper'
              : step.speaker === 'curator' ? 'speaker-curator' : '';
    const lbl = step.speaker === 'boss' ? '🎧 Начальник'
              : step.speaker === 'whisper' ? '👁️ Шёпот'
              : step.speaker === 'curator' ? '🎭 Куратор' : '';
    showModal(`
      <div class="intro-emoji">${step.emoji}</div>
      <div class="intro-kicker">${step.kicker}</div>
      <div class="intro-title">${step.title}</div>
      <div class="intro-body ${cls}">${lbl ? `<div class="speaker-label">${lbl}</div>` : ''}${step.body}</div>
      <button class="btnBig" data-advance>${step.btn}</button>
    `);
    modal.querySelector('[data-advance]').addEventListener('click', showStep);
  }
  showStep();
}

/* ============================================================
   STORY LOG
   ============================================================ */

function storyLog(){
  const items = [];
  const add = (icon, name, val, cls) => items.push({icon, name, val, cls});
  if(story.sad_villain) add('🦹', 'Грустный злодей',
    story.sad_villain === 'saved' ? 'спасён' : story.sad_villain === 'rules' ? 'уничтожен' : 'использован',
    story.sad_villain);
  if(story.robot_kitten) add('🤖', 'Робот-котёнок',
    story.robot_kitten === 'saved' ? 'оставлен как есть' : story.robot_kitten === 'rules' ? 'разобран' : 'память забрана',
    story.robot_kitten === 'memory' ? 'memory' : story.robot_kitten);
  if(story.whisperSaved) add('👁️', 'Шёпот', 'спасён', 'saved');
  else if(story.whisper === 'reported') add('👁️', 'Шёпот', 'донесён', 'rules');
  if(story.misha) add('🧒', 'Миша',
    story.misha === 'gift' ? 'ожил с подарком' : story.misha === 'chip' ? 'вспомнил отца' : 'отсортирован',
    story.misha === 'rules' ? 'rules' : 'saved');
  if(story.ex) add('👤', 'Она',
    story.ex === 'talked' ? 'отпущена' : story.ex === 'kept' ? 'осталась' : 'в прошлом',
    story.ex === 'sorted' ? 'rules' : 'saved');
  if(story.shadow) add('🔮', 'Тень',
    story.shadow === 'freed' ? 'освобождена' : story.shadow === 'merged' ? 'слита' : 'уничтожена',
    story.shadow === 'destroyed' ? 'rules' : 'memory');
  if(story.originalRobot) add('🤖', 'Оригинал',
    story.originalRobot === 'taken' ? 'взят' : story.originalRobot === 'weapon' ? 'стал оружием' : 'оставлен',
    story.originalRobot === 'weapon' ? 'rules' : 'saved');
  if(!items.length) return '';
  return `<div class="story-log">${items.map(i =>
    `<div class="item ${i.cls}">${i.icon} <b>${i.name}</b> — ${i.val}</div>`).join('')}</div>`;
}

/* ============================================================
   INTER-LEVEL LINE
   ============================================================ */

function interLevelLine(){
  const i = state.levelIndex;
  const lines = {
    0: '🎧 Начальник: «Хорошо. Один из объектов был… странным. Ты справился. Продолжай».',
    1: '🎧 Начальник: «Завтра инспекция. Не подведи. И не слушай то, чего нет».',
    2: '👁️ Шёпот: «Ты слышал меня. Я знал. Завтра призраки начнут возвращаться».',
    3: '🎧 Начальник: «Призраки исчезли. Завтра — важный день. Придёт Куратор».',
    4: '👁️ Шёпот: «Сегодня я выйду на ленту. Смотри. И слушай».',
    5: '🎭 Куратор: «Ты хорошо сортировал. Но вопросы — роскошь. Завтра ты узнаешь, что бывает за роскошь».',
    6: '👁️ Шёпот: «Это был Миша. Мой сын. Теперь ты знаешь всё».',
    7: '👁️ Шёпот: «Завтра — Пустота. Я пойду с тобой».',
    8: '🎭 Куратор: «Ты спустился. Завтра — финал. Скажи: кто ты?»'
  };
  const raw = lines[i] || '';
  if(!raw) return '';
  const isBoss = raw.startsWith('🎧'), isWhisper = raw.startsWith('👁️'), isCurator = raw.startsWith('🎭');
  const cls = isBoss ? 'speaker-boss' : isWhisper ? 'speaker-whisper' : isCurator ? 'speaker-curator' : '';
  const lbl = isBoss ? '🎧 Начальник' : isWhisper ? '👁️ Шёпот' : isCurator ? '🎭 Куратор' : '';
  const text = raw.replace(/^[🎧👁️🎭]\s*\S+:\s*/, '');
  return `<div class="intro-body ${cls}" style="margin-top:10px">
    <div class="speaker-label">${lbl}</div>${text}</div>`;
}

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */

function unlockAchievement(id){
  if(achievements.has(id)) return;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if(!a) return;
  achievements.add(id);
  const pop = document.createElement('div');
  pop.className = 'achievement-pop';
  pop.innerHTML = `<div class="icon">${a.icon}</div><div class="txt"><b>${a.name}</b><span>${a.desc}</span></div>`;
  $('achievementStack').appendChild(pop);
  setTimeout(() => { pop.style.opacity = '0'; pop.style.transition = 'opacity .4s';
    setTimeout(() => pop.remove(), 500); }, 3800);
  if(achievements.size >= 20) unlockAchievement('perfect');
}

function unlockEndingAchievement(key){
  const map = { savior:'savior_ending', power:'power_ending', destruction:'destruction_ending', nobody:'nobody_ending' };
  if(map[key]) unlockAchievement(map[key]);
  if(key === 'secret') unlockAchievement('secret');
}

/* ============================================================
   START LEVEL
   ============================================================ */

function startLevel(){
  const lv = LEVELS[state.levelIndex];
  if(!lv){ showMainMenu(); return; }
  state.level = lv;

  state.objects.forEach(o => { if(o.el.parentElement) o.el.remove(); });
  state.objects = [];
  state.selected = null;
  state.lives = 3;
  state.combo = 0;
  state.maxCombo = 0;
  state.timer = lv.duration;
  state.timerMax = lv.duration;
  state.heat = 0;
  state.light = 100;
  state.suspicion = 0;
  state.lightZeroTimer = 0;
  state.spawnTimer = 0.6;
  state.sortedCount = 0;
  state.namedSpawned = {};
  state.toolCooldowns = {};
  state.effects = {slow:0, fast:0, voidMode:0, laugh:0, doubt:0};
  state.ghostTimers = {};
  state.bossOrder = null;
  state.bossOrdersLeft = lv.bossOrders || 0;
  state.nextOrderAt = 15 + Math.random() * 10;
  state.npcShown = false;
  state.npcClicked = false;

  state.activeTools = getLevelTools(state.levelIndex);
  state.activeTools.forEach(id => state.toolCooldowns[id] = 0);

  state.paused = false;
  state.levelEnded = false;
  state.running = true;

  $('bossOrderBar').classList.remove('show');
  $('whisperNPC').classList.remove('show');
  $('robotNPC').classList.remove('show');
  $('tutorialHint').textContent = '';
  $('tutorialHint').style.opacity = '0';
  beltArea.classList.remove('dark', 'hot');
  document.body.classList.toggle('horror', lv.id === 9 || lv.id === 10);

  renderBins();
  renderTools();
  updateHUD();
  updateComboBadge();
  updateToolVisuals();
}

/* ============================================================
   END LEVEL
   ============================================================ */

function endLevel(win, reason){
  if(state.levelEnded) return;
  state.levelEnded = true;
  state.running = false;
  state.paused = true;

  state.objects.forEach(o => { if(o.el.parentElement) o.el.remove(); });
  state.objects = [];

  if(!win){
    showModal(`
      <div class="dEm">💔</div>
      <div class="dTitle">${reason || 'Смена окончена'}</div>
      <div class="dText" style="text-align:center;opacity:.75">
        Отсортировано: ${state.sortedCount}/${state.level.target}
      </div>
      <div class="stats">
        <div>Очки: <b>${state.score}</b></div>
        <div>Звёзд: <b>${state.totalStars}</b></div>
      </div>
      <button class="btnBig" id="retryBtn">Повторить смену</button>
    `);
    $('retryBtn').addEventListener('click', ()=>{ hideModal(); startLevel(); });
    return;
  }

  let stars = 1;
  if(state.lives === 3) stars++;
  if(state.maxCombo >= 5) stars++;
  state.totalStars += stars;

  if(state.levelIndex === 0) unlockAchievement('first_day');
  if(state.levelIndex === 8 && state.light > 0) unlockAchievement('void');
  if(state.totalStars >= 30) unlockAchievement('perfect');

  if(state.levelIndex === LEVELS.length - 1){
    const key = determineFinale();
    unlockEndingAchievement(key);
    showFinale(key);
    return;
  }

  showModal(`
    <div class="dEm">🎉</div>
    <div class="dTitle">Смена закрыта</div>
    <div class="dText" style="text-align:center;opacity:.7">${state.level.name}</div>
    <div style="text-align:center;font-size:26px;letter-spacing:7px;margin-top:8px;color:#ffd166">
      ${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}
    </div>
    ${interLevelLine()}
    ${storyLog()}
    <div class="stats">
      <div>Очки: <b>${state.score}</b></div>
      <div>Звёзд: <b>${state.totalStars}</b></div>
    </div>
    <button class="btnBig" id="nextBtn">Следующая смена →</button>
  `);
  $('nextBtn').addEventListener('click', ()=>{
    hideModal();
    state.levelIndex++;
    const nextId = LEVELS[state.levelIndex].id;
    runLevelIntro(nextId, ()=> startLevel());
  });
}

/* ============================================================
   FINALE
   ============================================================ */

function showFinale(key){
  const f = FINALES[key] || FINALES.nobody;
  $('finalOverlay').classList.add('show');
  $('finalCard').innerHTML = `
    <div class="final-emoji">${f.emoji}</div>
    <div class="final-title">${f.title}</div>
    <div class="final-text">${f.text}</div>
    <div class="final-epilogue">
      <div class="speaker-label">Эпилог</div>
      ${f.epilogue}
    </div>
    <div class="stats" style="margin-top:16px">
      <div>Очки: <b>${state.score}</b></div>
      <div>Звёзды: <b>${state.totalStars}/30</b></div>
      <div>Достижения: <b>${achievements.size}/${ACHIEVEMENTS.length}</b></div>
    </div>
    <button class="btnBig" id="restartBtn" style="margin-top:16px">Сыграть снова</button>
  `;
  $('restartBtn').onclick = ()=>{
    $('finalOverlay').classList.remove('show');
    resetAll();
  };
}

/* ============================================================
   RESET
   ============================================================ */

function resetAll(){
  Object.assign(story, createStoryFlags());
  achievements.clear();
  state.levelIndex = 0;
  state.score = 0;
  state.totalStars = 0;
  state.fulfilledOrders = 0;
  state.sabotagedOrders = 0;
  state.lassoCount = 0;
  state.objects.forEach(o => { if(o.el.parentElement) o.el.remove(); });
  state.objects = [];
  state.running = false;
  state.levelEnded = false;
  state.paused = false;
  beltArea.classList.remove('dark', 'hot');
  document.body.classList.remove('horror');
  $('bossOrderBar').classList.remove('show');
  $('whisperNPC').classList.remove('show');
  $('robotNPC').classList.remove('show');
  runIntroSequence(()=> startLevel());
}

function showMainMenu(){
  showModal(`
    <div class="dEm">🏭</div>
    <div class="dTitle">Бюро Незавершённых Вещей</div>
    <div class="dText" style="text-align:center">Ты уже был здесь. Или нет?</div>
    <button class="btnBig" id="menuStart">Начать смену</button>
  `);
  $('menuStart').onclick = ()=>{ hideModal(); resetAll(); };
}

/* ============================================================
   INIT
   ============================================================ */

requestAnimationFrame(loop);
runIntroSequence(()=> startLevel());
</script>
</body>
</html>
